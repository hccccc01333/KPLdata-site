<body data-page="compare-player.html" class="v2-page cmp-page compare-player-page">
<header id="siteHeader" class="topbar"></header>

<header class="lg-hero">
  <div class="lg-hero-gridlines" aria-hidden="true"></div>
  <div class="v2-wrap">
    <div class="v2-kicker"><i></i>COMPARE<b>·</b>选手对比</div>
    <h1 class="v2-h1">选手对比</h1>
    <p class="v2-lead">默认取<b>当前数据范围内出场达标（≥ 8 局）的前 3 名选手</b>放在一起，打开即可看结论，换对象在「高级条件」里改。
      雷达默认按<b>同位置分位</b>归一化（每名选手只和同位置选手比，越靠外越强），虚线为同位置中位 P50；可切「跨位置」看全选手口径。选择「位置」后，候选、分位与基准都只在该位置内计算。
      表格里的 KDA / 输出仍是原始值，跨位置不可直接比；要按分路看整体，用
      <a href="compare-lane.html" style="color:var(--gold);font-weight:700">「位置对比」</a>。
      想看战队 / 英雄？用 <a href="compare-team.html" style="color:var(--gold);font-weight:700">「战队对比」</a>
      / <a href="compare.html" style="color:var(--gold);font-weight:700">「英雄对比」</a>。</p>
    <div class="v2-stats lg-kpis" style="margin-top:26px">
      <div class="v2-stat"><b class="v2-mono" id="cmpCount">—</b><span>参与对比选手</span></div>
      <div class="v2-stat"><b class="v2-mono" id="cmpScope">—</b><span>数据范围</span></div>
      <div class="v2-stat"><b class="v2-mono" id="cmpClock">—</b><span>数据时钟</span></div>
    </div>
  </div>
</header>

<main class="wrap" style="margin-top:26px">
  <div class="scopebar" id="scopeBar"></div>

  <div class="filterbar">
    <label class="fld"><span>位置</span>
      <select id="posFilter">
        <option value="all">全部位置</option>
        <option>对抗路</option>
        <option>打野</option>
        <option>中路</option>
        <option>发育路</option>
        <option>游走</option>
      </select>
    </label>
    <label class="fld"><span>分位口径</span>
      <select id="posNorm">
        <option value="pos" selected>同位置</option>
        <option value="all">跨位置</option>
      </select>
    </label>
    <div class="pickers" id="pickers"></div>
  </div>

  <div class="cmp-grid">
    <div class="cmp-radar">
      <div class="cmp-cap"><b>对比图表</b><em>RADAR / TREND</em></div>
      <div id="radar"></div>
      <div class="cmp-legend" id="legend"></div>
    </div>
    <div class="cmp-table">
      <div class="cmp-cap"><b>数值对照</b><em>RAW DATA</em></div>
      <table id="cmpTable"></table>
      <div class="cmp-tip" id="cmpTip"></div>
    </div>
  </div>
</main>

<footer id="siteFooter" class="footer"></footer>

<script src="assets/data.js?v=85"></script>
<script src="assets/seasons.js?v=85"></script>
<script src="assets/common.js?v=20261110-curve"></script>
<script src="assets/share.js?v=20261102-brand"></script>
<script src="assets/compare.js?v=20261031c"></script>
<script>
KPL_COMPARE.init("player");
SHARE.mount(document.querySelector(".filterbar"), KPL_COMPARE.spec, "kpl-compare-player.png");

/* V2 hero KPI（只读现有 DOM 与站点公共 API，不改 compare.js 的渲染与交互）。 */
(function () {
  "use strict";
  function sync() {
    var sels = document.querySelectorAll("#pickers select"), n = 0, i;
    for (i = 0; i < sels.length; i++) if (sels[i].value) n++;
    var c = document.getElementById("cmpCount");
    if (c) c.textContent = n;
    var scope = "all";
    try { scope = localStorage.getItem("kpl_scope_v1") || "all"; } catch (e) {}
    var s = document.getElementById("cmpScope");
    if (s) s.textContent = KPL.scopeName(scope);
  }
  var clock = document.getElementById("cmpClock");
  if (clock) clock.textContent = KPL.data.generatedAt;
  sync();
  var host = document.getElementById("pickers");
  if (host) host.addEventListener("change", function () { setTimeout(sync, 0); });
  var bar = document.getElementById("scopeBar");
  if (bar) bar.addEventListener("change", function () { setTimeout(sync, 0); });
})();
</script>
</body>
</html>
