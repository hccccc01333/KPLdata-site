<style>
.q-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.q-head .seg{margin-left:0}
.q-table{width:100%;border-collapse:collapse;font-size:13px}
.q-table th,.q-table td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.q-table th:first-child,.q-table td:first-child,.q-table th.left,.q-table td.left{text-align:left}
.q-table thead th{font-size:11.5px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
.q-table thead th:hover{color:var(--gold)}
.q-table thead th.sorted{color:var(--gold)}
.q-table tbody tr:hover{background:var(--inset)}
.q-table .cell{display:flex;align-items:center;gap:8px}
/* SQL 控制台（本地工作台） */
.sql-area{width:100%;min-height:130px;resize:vertical;background:var(--inset);border:1px solid var(--line);
  border-radius:10px;color:var(--ink);font:13px/1.7 var(--mono);padding:12px 14px;outline:none}
.sql-area:focus{border-color:var(--line2)}
.sql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.sql-chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;min-width:0}
.sql-chip span{display:block;font-size:10px;color:var(--muted);letter-spacing:.05em}
.sql-chip b{display:block;font-family:var(--mono);font-size:15.5px;font-weight:800;margin-top:2px;color:var(--ink)}
.sql-chip b.gold{color:var(--gold)}
.sql-tbl{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.15s;font-family:var(--mono)}
.sql-tbl:hover{border-color:var(--gold)}
.sql-tbl b{font-size:13px;color:var(--gold)}
.sql-tbl small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
.sql-samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sql-samples button{padding:5px 12px;border:1px dashed var(--line2);border-radius:999px;background:transparent;
  color:var(--ink2);font-size:11.5px;cursor:pointer;font-family:inherit}
.sql-samples button:hover{color:var(--gold);border-color:var(--gold)}
.filterbar.sqlmode :is(.fld,.block-note,a.btn){display:none}
.q-table .cell img{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none}
.q-table .rk{font-family:var(--mono);color:var(--muted)}
.q-table .best{color:var(--gold);font-weight:800}
.q-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;overflow-x:auto;max-height:70vh}
</style>

<script>
(function () {
  "use strict";
  var D = KPL.data, K = KPL, $ = function (s) { return document.querySelector(s); };
  K.init();

  var mode = "team", sortKey = null, sortDir = -1, curScope = "all";

  var COLS = {
    team: [
      { k: "team", label: "战队", left: true },
      { k: "matches", label: "大场" },
      { k: "mWin", label: "大场胜" },
      { k: "games", label: "局数" },
      { k: "wins", label: "局胜" },
      { k: "wr", label: "单局胜率", fmt: function (v) { return K.pct(v, 1); } },
      { k: "goldDiff", label: "场均金差", fmt: function (v) { return K.signed(v); } },
      { k: "killDiff", label: "场均击杀差", fmt: function (v) { return (v > 0 ? "+" : "") + v; } },
    ],
    player: [
      { k: "name", label: "选手", left: true },
      { k: "team", label: "战队", left: true, fmt: function (v, r) { return v; } },
      { k: "pos", label: "位置" },
      { k: "games", label: "局数" },
      { k: "wr", label: "胜率", fmt: function (v) { return K.pct(v, 1); } },
      { k: "kda", label: "KDA" },
      { k: "mvp", label: "MVP" },
      { k: "mvpRate", label: "MVP 率", fmt: function (v) { return (v * 100).toFixed(1) + "%"; },
        val: function (r) { return r.mvp / Math.max(1, r.games); } },
      { k: "part", label: "参团率", fmt: function (v) { return v.toFixed(1) + "%"; } },
      { k: "dmg", label: "输出占比", fmt: function (v) { return v.toFixed(1) + "%"; } },
    ],
    hero: [
      { k: "name", label: "英雄", left: true },
      { k: "tier", label: "档位" },
      { k: "games", label: "出场" },
      { k: "wr", label: "胜率", fmt: function (v) { return K.pct(v, 1); } },
      { k: "bans", label: "禁用数" },
      { k: "banRate", label: "禁用率", fmt: function (v) { return (v * 100).toFixed(1) + "%"; },
        val: function (r, d) { return r.bans / Math.max(1, d.totals.battles); } },
      { k: "kda", label: "KDA" },
      { k: "dmg", label: "输出占比", fmt: function (v) { return v.toFixed(1) + "%"; } },
      { k: "bh", label: "承伤占比", fmt: function (v) { return v.toFixed(1) + "%"; } },
      { k: "gold", label: "场均经济", fmt: function (v) { return K.fmtInt(v); } },
    ],
  };

  function dataOf() {
    var d = K.scopeOf(curScope);
    if (mode === "team") return (d.teams || []).slice();
    if (mode === "player") return (d.players || []).filter(function (p) { return p.games >= 8; }).slice();
    return (d.heroes || []).slice();
  }

  function valOf(r, col, d) {
    return col.val ? col.val(r, d) : r[col.k];
  }

  function iconOf(r) {
    if (mode === "team") return r.icon || "";
    if (mode === "player") return r.icon || "";
    return r.icon || "";
  }

  function renderHead() {
    $("#qHead").innerHTML = "<tr><th style='text-align:left'>#</th>" + COLS[mode].map(function (c) {
      var cls = (c.left ? "left " : "") + (sortKey === c.k ? "sorted" : "");
      return '<th class="' + cls.trim() + '" data-k="' + c.k + '">' + c.label +
        (sortKey === c.k ? (sortDir < 0 ? " ↓" : " ↑") : "") + "</th>";
    }).join("") + "</tr>";
    $("#qHead").querySelectorAll("th[data-k]").forEach(function (th) {
      th.addEventListener("click", function () {
        var k = th.getAttribute("data-k");
        if (sortKey === k) sortDir = -sortDir;
        else { sortKey = k; sortDir = -1; }
        render();
      });
    });
  }

  /* 当前视图（范围 + 搜索 + 位置筛选 + 排序）——表格和导出共用同一份，避免"看到的和导出的不一致" */
  function currentView() {
    var d = K.scopeOf(curScope);
    var minG = parseInt(($("#qMin") || {}).value || "0", 10) || 0;
    var q = $("#qSearch").value.trim().toLowerCase();
    var rows = dataOf().filter(function (r) {
      if (mode === "player" && $("#qPos").value && r.pos !== $("#qPos").value) return false;
      if (q) {
        var hay = mode === "team" ? r.team : (mode === "hero" ? r.name : r.name + " " + r.team);
        if (String(hay).toLowerCase().indexOf(q) < 0) return false;
      }
      if (minG > 0 && (Number(r.games) || 0) < minG) return false;
      return true;
    });
    var key = sortKey || (mode === "player" ? "kda" : mode === "hero" ? "games" : "wr");
    var col = COLS[mode].filter(function (c) { return c.k === key; })[0] || COLS[mode][1];
    rows.sort(function (a, b) {
      var va = valOf(a, col, d), vb = valOf(b, col, d);
      if (typeof va === "string") return sortDir * String(va).localeCompare(String(vb), "zh");
      return sortDir * ((va || 0) - (vb || 0));
    });
    return { d: d, rows: rows, col: col };
  }

  function render() {
    var view = currentView();
    var d = view.d, rows = view.rows;
    $("#qNote").textContent = rows.length + " 行 · " + K.scopeName(curScope);
    renderHead();
    /* 各列最佳值（用于金色高亮，仅数值列） */
    var bests = {};
    COLS[mode].forEach(function (c) {
      if (c.label === "位置" || c.label === "档位" || c.label === "战队") return;
      var vals = rows.map(function (r) { return valOf(r, c, d); }).filter(function (v) { return typeof v === "number"; });
      if (vals.length) bests[c.k] = Math.max.apply(null, vals);
    });
    $("#qBody").innerHTML = rows.slice(0, 200).map(function (r, i) {
      var name = mode === "team" ? r.team : r.name;
      // 战队列直接进详情页（team.html 的 id 就是队名）；原来跳到 teams.html 榜单，等于没跳
      var href = mode === "team" ? "team.html?id=" + encodeURIComponent(r.team) :
        (mode === "hero" ? "hero.html?id=" + encodeURIComponent(r.name) : "player.html?id=" + encodeURIComponent(r.name));
      var ic = iconOf(r);
      return "<tr>" +
        '<td class="rk">' + (i + 1) + "</td>" +
        COLS[mode].map(function (c, ci) {
          var v = valOf(r, c, d);
          var txt = c.fmt ? c.fmt(v, r) : String(v == null ? "—" : v);
          if (ci === 0) {
            return '<td class="left"><a class="cell" href="' + href + '">' +
              (ic ? '<img src="' + K.esc(ic) + '" alt="" loading="lazy">' : "") + "<span>" + K.esc(name) + "</span></a></td>";
          }
          var best = (bests[c.k] != null && typeof v === "number" && v === bests[c.k] && rows.length > 1);
          return '<td class="' + (c.left ? "left " : "") + (best ? "best" : "") + '">' + K.esc(txt) + "</td>";
        }).join("") + "</tr>";
    }).join("") || '<tr><td colspan="12" style="color:var(--muted);text-align:center;padding:26px">没有匹配的行</td></tr>';
  }

  function fillPos() {
    if (mode !== "player") { $("#posWrap").style.display = "none"; return; }
    $("#posWrap").style.display = "";
    var d = K.scopeOf(curScope);
    var set = {};
    (d.players || []).forEach(function (p) { if (p.pos) set[p.pos] = 1; });
    var order = ["对抗路", "打野", "中路", "发育路", "游走"];
    var cur = $("#qPos").value;
    $("#qPos").innerHTML = '<option value="">全部位置</option>' +
      Object.keys(set).sort(function (a, b) {
        var ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      }).map(function (p) { return "<option>" + K.esc(p) + "</option>"; }).join("");
    $("#qPos").value = cur;
  }

  $("#typeTabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    mode = b.getAttribute("data-m");
    var isSql = mode === "sql";
    $("#sqlPanel").hidden = !isSql;
    $("#qWrap").hidden = isSql;
    $("#qFilter").classList.toggle("sqlmode", isSql);
    $("#qExport").hidden = isSql;
    if (isSql) {
      $("#qNote").textContent = "本地 SQLite · 只读";
      $("#qSearch").value = "";
      if (!sqlInited) { sqlInited = true; initSql(); }
      return;
    }
    $("#sqlPanel").hidden = true;
    sortKey = null; sortDir = -1;
    fillPos();
    render();
  });

  /* ---------- SQL 控制台（本地工作台）：server.py 提供 /api，静态托管时显示启动指引 ---------- */
  var sqlInited = false, sqlBound = false;
  var SQL_SAMPLES = [
    ["2026 赛季大场胜率", "SELECT team1 AS 队伍, SUM(score1) AS 胜局, SUM(score2) AS 负局,\n       ROUND(100.0*SUM(score1)/(SUM(score1)+SUM(score2)),1) AS 胜率\nFROM schedule WHERE date >= '2026-01-01'\nGROUP BY team1 HAVING 胜局+负局 > 0 ORDER BY 胜率 DESC LIMIT 12;"],
    ["选手赛季榜（2026）", "SELECT name AS 选手, games AS 局, mvp AS MVP, kills AS 击杀,\n       ROUND(kills*1.0/MAX(games-deaths,1),2) AS 场均存活K,\n       dmgShareAvg AS 场均输出占比, winRate AS 胜率\nFROM v_player_season WHERE year = 2026 AND games >= 20\nORDER BY mvp DESC LIMIT 15;"],
    ["单局 MVP 榜", "SELECT name, COUNT(*) AS MVP次数 FROM battle_players WHERE mvp=1\nGROUP BY name ORDER BY MVP次数 DESC LIMIT 12;"],
    ["英雄出场与胜率", "SELECT b.hero AS 英雄, COUNT(*) AS 出场,\n       ROUND(100.0*SUM(CASE WHEN (b.camp=1 AND u.win=1) OR (b.camp=2 AND u.win=2) THEN 1 ELSE 0 END)/COUNT(*),1) AS 胜率\nFROM battle_players b JOIN battles u USING(battleId)\nGROUP BY b.hero HAVING 出场 >= 30 ORDER BY 胜率 DESC LIMIT 15;"],
    ["英雄年度登场榜（视图）", "SELECT hero AS 英雄, year AS 年份, picks AS 登场, wins AS 胜场,\n       ROUND(100.0*wins/picks,1) AS 胜率\nFROM v_hero_pick WHERE picks >= 40 AND year >= 2024\nORDER BY year DESC, picks DESC LIMIT 15;"],
    ["战队年度榜（视图）", "SELECT year AS 年份, team AS 战队, matches AS 大场, wins AS 胜, losses AS 负,\n       ROUND(100.0*wins/(wins+losses),1) AS 胜率\nFROM v_team_season WHERE year = 2025 AND matches >= 10\nORDER BY 胜率 DESC;"],
    ["双人组队胜率", "SELECT a.name AS 选手A, b.name AS 选手B, COUNT(*) AS 同场,\n       SUM(CASE WHEN (a.camp=1 AND u.win=1) OR (a.camp=2 AND u.win=2) THEN 1 ELSE 0 END) AS 胜场\nFROM battle_players a\nJOIN battle_players b ON a.battleId=b.battleId AND a.camp=b.camp AND a.name<b.name\nJOIN battles u ON u.battleId=a.battleId\nJOIN schedule s ON s.matchId=u.matchId\nWHERE s.date >= '2026-01-01'\nGROUP BY a.name, b.name HAVING 同场 >= 30\nORDER BY 同场 DESC LIMIT 12;"],
    ["英雄对位（同局对面）", "SELECT a.hero AS 英雄A, b.hero AS 英雄B, COUNT(*) AS 对位局,\n       SUM(CASE WHEN (a.camp=1 AND u.win=1) OR (a.camp=2 AND u.win=2) THEN 1 ELSE 0 END) AS A胜\nFROM battle_players a\nJOIN battle_players b ON a.battleId=b.battleId AND a.camp<>b.camp\nJOIN battles u ON u.battleId=a.battleId\nJOIN schedule s ON s.matchId=u.matchId\nWHERE s.date >= '2025-01-01'\nGROUP BY a.hero, b.hero HAVING 对位局 >= 20\nORDER BY 对位局 DESC LIMIT 12;"],
    ["前期金差与胜负", "SELECT CASE WHEN f.goldDiff >= 0 THEN u.t1 ELSE u.t2 END AS 前期领先方,\n       CASE WHEN f.goldDiff >= 0 THEN\n         CASE WHEN u.win=1 THEN 1 ELSE 0 END ELSE\n         CASE WHEN u.win=2 THEN 1 ELSE 0 END END AS 领先方最终胜,\n       COUNT(*) AS 样本\nFROM (SELECT battleId, goldDiff, ROW_NUMBER() OVER (PARTITION BY battleId ORDER BY m) rn\n      FROM frames WHERE m BETWEEN 4 AND 6) f\nJOIN battles u USING(battleId)\nWHERE f.rn = 1 GROUP BY 前期领先方;"],
    ["让二追三的系列赛", "SELECT matchId, team1, team2, score1, score2, date FROM schedule\nWHERE (score1=3 AND score2=2) OR (score1=2 AND score2=3)\nORDER BY date DESC LIMIT 12;"],
    ["平均经济差曲线", "SELECT CAST(m AS INT) AS 分钟, ROUND(AVG(goldDiff)/1000,2) AS 平均金差k, COUNT(*) AS 样本\nFROM frames GROUP BY CAST(m AS INT) ORDER BY 分钟 LIMIT 40;"],
    ["教练生涯样本", "SELECT coach AS 教练, series AS 系列, seriesWins AS 胜, games AS 局, bpGames AS BP局\nFROM coach_stats ORDER BY series DESC LIMIT 12;"],
    ["场均承伤榜（末帧）", "SELECT mp.name AS 选手, mp.hero AS 英雄, COUNT(*) AS 局,\n       ROUND(AVG(mp.tank)/10000,1) AS 场均承伤w\nFROM minute_players mp\nWHERE mp.m = (SELECT MAX(m2.m) FROM minute_players m2 WHERE m2.battleId = mp.battleId)\nGROUP BY mp.name HAVING 局 >= 5 ORDER BY 场均承伤w DESC LIMIT 12;"],
    ["单局承伤对比曲线", "SELECT CAST(m AS INT) AS 分钟,\n       ROUND(SUM(CASE WHEN camp=1 THEN tank ELSE 0 END)/5.0/10000,2) AS 蓝方均承伤w,\n       ROUND(SUM(CASE WHEN camp=2 THEN tank ELSE 0 END)/5.0/10000,2) AS 红方均承伤w\nFROM minute_players WHERE battleId = '48251408_41_1793354660'\nGROUP BY CAST(m AS INT) ORDER BY 分钟 LIMIT 40;"]
  ];
  function initSql() {
    if (!sqlBound) { sqlBound = true; bindSql(); }
    loadSql();
  }
  function bindSql() {
    $("#sqlSamples").innerHTML = SQL_SAMPLES.map(function (s, i) {
      return '<button type="button" data-i="' + i + '">' + K.esc(s[0]) + "</button>";
    }).join("");
    $("#sqlSamples").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      $("#sqlText").value = SQL_SAMPLES[Number(b.getAttribute("data-i"))][1];
      runSql();
    });
    /* 保存的查询：存 localStorage，点击载入，× 删除 */
    function savedList() {
      try { return JSON.parse(localStorage.getItem("kpl_sql_saved") || "[]"); } catch (e) { return []; }
    }
    function renderSaved() {
      var list = savedList();
      $("#sqlSaved").innerHTML = list.length
        ? list.map(function (s2, i) {
          return '<button type="button" data-i="' + i + '" title="' + K.esc(s2.sql) + '">★ ' + K.esc(s2.name) +
            '<span data-del="' + i + '" style="margin-left:6px;color:var(--muted)">×</span></button>';
        }).join("")
        : '<span class="block-note mono" style="color:var(--muted)">还没有保存的查询：写好 SQL 后点「★ 保存这条查询」</span>';
    }
    $("#sqlSaved").addEventListener("click", function (e) {
      var del = e.target.getAttribute("data-del");
      if (del != null) {
        var list = savedList();
        list.splice(Number(del), 1);
        try { localStorage.setItem("kpl_sql_saved", JSON.stringify(list)); } catch (err) {}
        renderSaved();
        return;
      }
      var b = e.target.closest("button");
      if (!b) return;
      var s3 = savedList()[Number(b.getAttribute("data-i"))];
      if (s3) { $("#sqlText").value = s3.sql; runSql(); }
    });
    $("#sqlSave").addEventListener("click", function () {
      var sql = $("#sqlText").value.trim();
      if (!sql) return;
      var name = (sql.replace(/\s+/g, " ").slice(0, 26)) + "…";
      var list = savedList();
      list.unshift({ name: name, sql: sql });
      try { localStorage.setItem("kpl_sql_saved", JSON.stringify(list.slice(0, 12))); } catch (err) {}
      renderSaved();
    });
    $("#sqlText").value = SQL_SAMPLES[0][1];
    $("#sqlRun").addEventListener("click", runSql);
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && mode === "sql") { e.preventDefault(); runSql(); }
    });
    $("#sqlCsv").addEventListener("click", function () {
      if (!sqlLast) return;
      var rows = [sqlLast.columns].concat(sqlLast.rows);
      K.exportCSV("SQL查询结果.csv", rows);
    });
    renderSaved();
  }
  var sqlRanOnce = false;
  function loadSql() {
    fetch("/api/status").then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (st) {
      $("#sqlOff").hidden = true;
      $("#sqlApp").hidden = false;
      var c = st.counts || {};
      var chips = [["数据范围", (st.dateRange || [])[0] + " ~ " + (st.dateRange || [])[1], false],
        ["比赛（大场）", c.schedule, true], ["对局（小场）", c.battles, false],
        ["选手对局行", c.battle_players, false], ["复盘帧", c.frames, false],
        ["教练任期", c.coaches, false], ["数据库", st.dbMB + " MB", false]];
      $("#sqlChips").innerHTML = chips.map(function (x) {
        return '<div class="sql-chip"><span>' + K.esc(x[0]) + '</span><b class="' + (x[2] ? "gold" : "") + '">' +
          K.esc(x[1] == null ? "—" : x[1]) + "</b></div>";
      }).join("");
      $("#sqlDbNote").textContent = "缓存建于 " + st.builtAt + " · 数据只读，assets 更新后重启自动重建";
      if (!sqlRanOnce) { sqlRanOnce = true; runSql(); }
      return fetch("/api/schema").then(function (r) { return r.json(); });
    }).then(function (d) {
      if (!d || !d.tables) return;
      $("#sqlTables").innerHTML = d.tables.map(function (t) {
        return '<div class="sql-tbl" data-t="' + K.esc(t.name) + '"><b>' + K.esc(t.name) + "</b><small>" +
          (t.type === "view" ? "视图 · " : "") + t.rows.toLocaleString() + " rows · " + K.esc(t.columns.join(" · ")) + "</small></div>";
      }).join("");
      if (!$("#sqlTables").dataset.bound) {
        $("#sqlTables").dataset.bound = "1";
        $("#sqlTables").addEventListener("click", function (e) {
          var card = e.target.closest(".sql-tbl");
          if (!card) return;
          $("#sqlText").value = "SELECT * FROM " + card.getAttribute("data-t") + " LIMIT 10;";
          runSql();
        });
      }
    }).catch(function () {
      fetch("/api/health").then(function (r) { return r.json(); }).then(function (h) {
        if (h && h.ok && !h.ready) {
          $("#sqlOff").hidden = false;
          $("#sqlApp").hidden = true;
          $("#sqlOff").innerHTML = '<p style="font-weight:700;color:var(--ink)">本地数据库构建中…</p>' +
            '<p style="color:var(--muted);font-size:13px">首次启动约 10-30 秒，8 秒后自动重试；期间站点页面可正常浏览。</p>';
          setTimeout(function () { if (mode === "sql") loadSql(); }, 8000);
          return;
        }
        showSqlOff();
      }).catch(showSqlOff);
    });
  }
  function showSqlOff() {
    $("#sqlOff").hidden = false;
    $("#sqlApp").hidden = true;
    $("#sqlOff").innerHTML = '<p style="font-weight:700;color:var(--ink);margin-bottom:8px">SQL 控制台需要本地运行的服务</p>' +
      '<p style="color:var(--muted);font-size:13px">把仓库下载到本地，在根目录执行下面一条命令（零第三方依赖，仅 Python 3.9+）：</p>' +
      '<p style="margin-top:12px"><code class="mono" style="background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;color:var(--gold)">python server.py</code></p>' +
      '<p style="color:var(--muted);font-size:12px;margin-top:12px">Windows 可直接双击 <span class="mono">启动本地版.bat</span>。启动后回到本页即可查询。</p>';
  }
  var sqlLast = null;
  function runSql() {
    var sql = $("#sqlText").value;
    $("#sqlErr").hidden = true;
    $("#sqlMeta").innerHTML = "查询中…";
    fetch("/api/query", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sql: sql }) }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) {
        $("#sqlErr").textContent = d.error || "查询失败";
        $("#sqlErr").hidden = false;
        $("#sqlMeta").innerHTML = "";
        return;
      }
      sqlLast = d;
      $("#sqlMeta").innerHTML = "<span><b>" + d.rowCount.toLocaleString() + "</b> 行</span>" +
        "<span><b>" + d.ms + "</b> ms</span>" +
        (d.truncated ? '<span style="color:var(--gold)">已截断（上限 2000 行，请加 LIMIT）</span>' : "");
      $("#sqlHead").innerHTML = "<tr>" + d.columns.map(function (c2) { return "<th>" + K.esc(c2) + "</th>"; }).join("") + "</tr>";
      $("#sqlBody").innerHTML = d.rows.map(function (row) {
        return "<tr>" + row.map(function (v) { return "<td>" + K.esc(v) + "</td>"; }).join("") + "</tr>";
      }).join("") || '<tr><td colspan="12" style="color:var(--muted);text-align:center;padding:26px">0 行</td></tr>';
    }).catch(function (e) {
      $("#sqlErr").textContent = String(e);
      $("#sqlErr").hidden = false;
    });
  }
  if (new URLSearchParams(location.search).get("m") === "sql") {
    var sqlBtn = document.querySelector('#typeTabs [data-m="sql"]');
    if (sqlBtn) sqlBtn.click();
  }

  curScope = K.scopeBar("#scopeBar", function (id) { curScope = id; fillPos(); render(); });
  $("#qSearch").addEventListener("input", render);
  $("#qPos").addEventListener("change", render);
  $("#qMin").addEventListener("change", function () { sortKey = null; sortDir = -1; render(); });
  $("#qExport").addEventListener("click", function () {
    // 导出 = 当前视图（同一范围/搜索/位置筛选/排序），并带上排名与筛选条件说明
    var view = currentView();
    var d = view.d, rows2 = view.rows, col = view.col;
    var conds = [];
    var q = $("#qSearch").value.trim();
    if (q) conds.push("搜索=" + q);
    if (mode === "player" && $("#qPos").value) conds.push("位置=" + $("#qPos").value);
    var scopeTxt = K.scopeName(curScope);
    var head = ["排名"].concat(COLS[mode].map(function (c) { return c.label; }))
      .concat(["数据范围", "排序", "筛选条件"]);
    var rows = [head];
    rows2.forEach(function (r, i) {
      rows.push([i + 1].concat(COLS[mode].map(function (c) {
        var v = valOf(r, c, d);
        return c.fmt ? c.fmt(v, r) : (v == null ? "" : v);
      })).concat([scopeTxt, col.label + (sortDir < 0 ? " ↓" : " ↑"), conds.join(" · ") || "无"]));
    });
    if (!rows2.length) {
      $("#qNote").textContent = "当前筛选没有可导出的行";
      return;
    }
    K.exportCSV("数据查询_" + mode + "_" + scopeTxt + ".csv", rows);
  });

  curScope = K.scopeBar("#scopeBar", function (id) { curScope = id; fillPos(); render(); });
  if (mode !== "sql") { fillPos(); render(); }
})();
</script>
</body>
</html>
