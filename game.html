<script>
(function () {
  "use strict";
  var D = KPL.data, K = KPL, $ = function (s) { return document.querySelector(s); };
  K.init();
  var CP = K.chartPalette();
  var BID = new URLSearchParams(location.search).get("id") || "";

  function fail(msg, back) {
    $("#wrapHero").innerHTML = '<header class="page-hero"><div class="wrap">' +
      '<div class="ph-kicker mono">GAME · 对局详情</div><h1>' + K.esc(msg) + "</h1>" +
      '<p>对局详情覆盖 2019–2026 全部已完赛对局；请从比赛页或选手页进入。</p>' +
      '<div class="slide-cta" style="margin-top:18px"><a class="btn primary" href="' + (back || "schedule.html") +
      '">' + (back ? "返回比赛" : "返回赛程") + "</a></div></div></header>";
  }

  if (!BID) { fail("缺少对局参数"); return; }
  /* battle_id 前缀与官方 match_id 不同：全文索引查找 */
  var MID = "", LG = "";
  Object.keys(window.KPL_GAME_INDEX || {}).some(function (mid) {
    var e = KPL_GAME_INDEX[mid];
    for (var i = 0; i < e.b.length; i++) {
      if (e.b[i][0] === BID) { MID = mid; LG = e.lg; return true; }
    }
    return false;
  });
  if (!MID) { fail("未找到该对局"); return; }
  var sched = (window.KPL_SCHEDULE_ALL || []).filter(function (r) { return r.matchId === MID; })[0] || {};

  var heroIcon = {};
  ((K.scopeOf("all") || {}).heroes || []).forEach(function (h) { heroIcon[h.name] = h.icon; });

  fetch("assets/games/" + LG + ".json").then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function (data) {
    var g = data[BID];
    if (!g) { fail("未找到该对局", "match.html?id=" + MID); return; }
    render(g);
  }).catch(function () {
    fail("对局数据加载失败（请通过本地服务器打开站点）");
  });

  function render(g) {
    var isLiveG = g.live === 1 || g.win === 0 || g.win == null;
    var winName = g.win === 1 ? g.t1 : (g.win === 2 ? g.t2 : "");
    $("#wrapHero").innerHTML = '<header class="page-hero"><div class="wrap">' +
      '<div class="ph-kicker mono">GAME · ' + K.esc(sched.leagueName || "") +
      (sched.stage ? " · " + K.esc(sched.stage) : "") + " · " + K.esc(sched.date || "") + " · 第 " + g.seq + " 局</div>" +
      '<div class="g-score">' +
      '<div class="g-team ' + (g.win === 1 ? "win" : "") + '">' + (g.i1 ? '<img src="' + K.esc(g.i1) + '" alt="">' : "") +
      "<span>" + K.esc(g.t1) + "</span><b class='mono'>" + g.k1 + "</b><i>击杀</i></div>" +
      '<div class="g-mid"><span class="mono">' + g.dur + " 分钟</span><b class='mono'>" +
      K.signed(g.g1 - g.g2) + "</b><span class='mono' style='color:var(--muted)'>金币差（蓝方视角）</span>" +
      (isLiveG ? "<em>" + K.liveBadge() + " 已进行 " + g.dur + " 分钟</em>"
               : "<em>胜方：" + K.esc(winName) + "</em>") + "</div>" +
      '<div class="g-team r ' + (g.win === 2 ? "win" : "") + '">' + (g.i2 ? '<img src="' + K.esc(g.i2) + '" alt="">' : "") +
      "<span>" + K.esc(g.t2) + "</span><b class='mono'>" + g.k2 + "</b><i>击杀</i></div></div>" +
      '<div style="margin-top:14px">' + K.coverageBadges(K.battleCoverageMask(MID, BID)) +
      '<div class="cov-note">本局可看的内容：亮色=有数据，虚线=官方未提供</div></div>' +
      '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<a class="btn ghost sm" href="match.html?id=' + K.esc(MID) + '">← 整场详情</a>' +
      '<a class="btn ghost sm" href="bp-studio.html?match=' + encodeURIComponent(MID) + '&amp;g=' + encodeURIComponent(g.seq) + '">赛事 BP 演播室 →</a>' +
      (g.video ? '<a class="btn primary sm" href="' + K.esc(g.video) + '" target="_blank" rel="noopener">看本局回放 ↗</a>'
               : '<a class="btn ghost sm" href="https://search.bilibili.com/all?keyword=' +
                 encodeURIComponent("KPL " + g.t1 + " " + g.t2 + " 第" + g.seq + "局") +
                 '" target="_blank" rel="noopener">去 B 站找本局 ↗</a>') +
      "</div></div></header>";

    /* BP */
    var picks1 = g.bp.filter(function (b) { return b[0] === 1 && b[1] === 1; });
    var picks2 = g.bp.filter(function (b) { return b[0] === 2 && b[1] === 1; });
    var bans1 = g.bp.filter(function (b) { return b[0] === 1 && b[1] === 0; });
    var bans2 = g.bp.filter(function (b) { return b[0] === 2 && b[1] === 0; });
    function pickChips(list) {
      return list.map(function (p, i) {
        var ic = heroIcon[p[2]];
        return '<span class="bp-pick"><em>' + (i + 1) + '</em>' +
          (ic ? '<img src="' + K.esc(ic) + '" alt="">' : "") + K.esc(p[2]) + "</span>";
      }).join("");
    }
    function banChips(list) {
      return list.map(function (p) {
        var ic = heroIcon[p[2]];
        return (ic ? '<img src="' + K.esc(ic) + '" alt="" title="禁用 ' + K.esc(p[2]) + '">' : "");
      }).join("");
    }

    /* 选手行 */
    function sideRows(camp, team, win) {
      return g.players.filter(function (p) { return p.c === camp; }).map(function (p) {
        var ic = heroIcon[p.h];
        var equips = (p.eq || []).map(function (n) {
          var ei = (window.KPL_EQUIP_ICONS || {})[n] || "";
          return '<span class="g-eq" title="' + K.esc(n) + '">' + (ei ? '<img src="' + K.esc(ei) + '" alt="" loading="lazy">' : "") + "</span>";
        }).join("");
        var ava = p.pi ? '<img class="g-ava" src="' + K.esc(p.pi) + '" alt="" loading="lazy">'
          : '<span class="g-ava ph">' + K.esc(String(p.n).slice(0, 1)) + "</span>";
        return '<div class="g-prow' + (p.mvp ? " mvp" : "") + '">' +
          '<a class="g-hero" href="hero.html?id=' + encodeURIComponent(p.h) + '">' +
          (ic ? '<img src="' + K.esc(ic) + '" alt="">' : "") + "<span>" + K.esc(p.h) + "</span></a>" +
          '<a class="g-player" href="player.html?id=' + encodeURIComponent(p.n) + '">' + ava +
          "<span>" + K.esc(p.n) + (p.mvp ? '<em class="mvp-tag">MVP</em>' : "") + "</span></a>" +
          '<div class="g-kda mono">' + p.k + "/" + p.d + "/" + p.a + "</div>" +
          '<div class="g-stat"><span class="mono">' + K.fmtInt(p.g) + "</span><small>经济</small></div>" +
          '<div class="g-stat"><span class="mono">' + K.mpct(p.dmg, 1) + '</span><small>输出</small></div>' +
          '<div class="g-stat"><span class="mono">' + K.mpct(p.bh, 1) + '</span><small>承受</small></div>' +
          '<div class="g-kit">' + equips +
          (p.sai ? '<span class="g-eq sa" title="' + K.esc(p.sa) + '"><img src="' + K.esc(p.sai) + '" alt=""></span>' : "") +
          "</div></div>";
      }).join("");
    }

    var hasReplay = window.KPL_REPLAY && KPL_REPLAY.hasReplay(MID);
    $("#main").innerHTML =
      '<div class="block-head"><h2><i></i>复盘工作台</h2><span class="block-note mono">' +
      (hasReplay ? "先看一句话结论与三个转折 · 需要时再展开逐分钟时间轴"
                 : "本局没有分钟级快照 · 只有基础比分 / BP / 选手明细") + "</span></div>" +
      '<div class="panel" style="padding:14px"><div id="replayWorkbench">' +
      (hasReplay ? "" : '<div class="empty-tip">本局暂无分钟级复盘数据。' +
        (window.KPL_TOTALS ? "全站 " + KPL_TOTALS.replayBattles + " / " + K.fmtInt(KPL_TOTALS.battles) +
          " 局有直播胜率；其余只展示赛果、BP 与选手明细。" : "仅有赛果、BP 与选手明细。") + "</div>") + "</div></div>" +
      '<div class="bp-grid" style="margin-top:18px">' +
      '<div class="bp-side blue"><div class="hd">' + K.esc(g.t1) + "（蓝方）</div>" +
      '<div class="bp-picks">' + pickChips(picks1) + "</div>" +
      '<div class="bp-bans">ban：' + banChips(bans1) + "</div></div>" +
      '<div class="bp-side red"><div class="hd">' + K.esc(g.t2) + "（红方）</div>" +
      '<div class="bp-picks">' + pickChips(picks2) + "</div>" +
      '<div class="bp-bans">ban：' + banChips(bans2) + "</div></div></div>" +

      '<div class="g-teams">' +
      '<div class="panel g-side"><div class="panel-title">' + K.esc(g.t1) + " 阵容" +
      (g.win === 1 ? ' <em class="mono" style="color:var(--gold)">胜</em>' : "") + "</div>" + sideRows(1, g.t1, g.win === 1) + "</div>" +
      '<div class="panel g-side"><div class="panel-title">' + K.esc(g.t2) + " 阵容" +
      (g.win === 2 ? ' <em class="mono" style="color:var(--gold)">胜</em>' : "") + "</div>" + sideRows(2, g.t2, g.win === 2) + "</div>" +
      "</div>" +
      '<div class="panel-foot mono" style="margin-top:12px">数据来源：官方逐局数据 · ' +
      K.esc(MID) + " 第 " + g.seq + " 局" + (g.video ? "" : "（本局无回放视频）") + "</div>";
    if (hasReplay) {
      KPL_REPLAY.mount(document.getElementById("replayWorkbench"), { matchId: MID, battleId: BID });
    }

    /* 数据曲线（比赛期间采集的指标序列，如已归档） */
    (function () {
      var sc = document.createElement("script");
      sc.src = "assets/live.js?ts=" + Date.now();
      sc.onload = function () {
        sc.remove();
        var L = window.KPL_LIVE || {};
        var all = (L.history || []).concat(L.matches || []);
        var h = all.filter(function (x) { return x.battleId === BID; })[0];
        if (!h || !(h.pts || []).length || h.pts.length < 3) return;
        renderCurves(h);
      };
      sc.onerror = function () { sc.remove(); };
      document.head.appendChild(sc);
    })();
    K.refresh();
  }

  function renderCurves(h) {
    var pts = h.pts;
    var LANES = ["对抗路", "打野", "中路", "发育路", "游走"];
    var laneNames = null, curTab = "win", curveEvents = [];
    var TEAM_TABS = [
      ["win", "胜率"], ["eco", "经济"], ["gd", "经济差"], ["kill", "击杀"],
      ["tower", "推塔"], ["res", "资源"]
    ];
    var LANE_TABS = [
      ["player", "分路经济"], ["dmg", "分路输出"],
      ["playerDiff", "分路经济差"], ["dmgDiff", "分路输出差"]
    ];
    var box = document.createElement("div");
    box.className = "panel";
    box.style.marginTop = "14px";
    box.innerHTML =
      '<div class="panel-title">数据曲线 <em class="mono">逐分钟采集 · 模型实时推算</em></div>' +
      '<div class="curve-groups">' +
        '<div class="curve-group"><span class="curve-label mono">团队</span>' +
          '<div class="seg curve-tabs" id="curveTabsTeam">' +
          TEAM_TABS.map(function (t, i) { return '<button type="button" data-t="' + t[0] + '" class="' + (i === 0 ? "on" : "") + '">' + t[1] + "</button>"; }).join("") +
          "</div></div>" +
        '<div class="curve-group"><span class="curve-label mono">分路</span>' +
          '<div class="seg curve-tabs" id="curveTabsLane">' +
          LANE_TABS.map(function (t) { return '<button type="button" data-t="' + t[0] + '">' + t[1] + "</button>"; }).join("") +
          "</div></div>" +
      "</div>" +
      '<div class="curve-summary" id="curveSummary"></div>' +
      '<div class="live-chart" id="curveChart"></div>' +
      '<div class="panel-foot mono" id="curveNote"></div>';
    var main = document.getElementById("main");
    if (main) main.prepend(box);

    if (window.KPL_REPLAY && KPL_REPLAY.loadPackage) {
      KPL_REPLAY.loadPackage(MID, function (pkg) {
        var bt = null;
        if (pkg && pkg.battles) {
          for (var i = 0; i < pkg.battles.length; i++) {
            if (pkg.battles[i].battleId === BID) { bt = pkg.battles[i]; break; }
          }
        }
        if (bt && bt.names && bt.names.length === 10) laneNames = bt.names;
        if (bt && bt.events) curveEvents = bt.events || [];
        if (["player", "dmg", "playerDiff", "dmgDiff", "win", "eco", "gd", "kill", "tower", "res"].indexOf(curTab) >= 0) draw(curTab);
      });
    }

    function kFmt(v) {
      var n = Number(v || 0);
      return (n > 0 ? "+" : n < 0 ? "-" : "") + Math.abs(Math.round(n / 1000)) + "k";
    }
    function absFmt(v) {
      return Math.round(Math.abs(Number(v || 0)) / 1000) + "k";
    }
    function updateSummary(m) {
      var box2 = document.getElementById("curveSummary");
      if (!box2) return;
      var best = pts.reduce(function (a, r) {
        return Math.abs(Number(r[0]) - m) < Math.abs(Number(a[0]) - m) ? r : a;
      }, pts[0]);
      var evs = (curveEvents || []).filter(function (e) { return Math.abs(Number(e.m) - Number(best[0])) <= 0.75; }).slice(0, 2);
      box2.innerHTML =
        '<div><span>分钟</span><b>' + Number(best[0]).toFixed(0) + "′</b></div>" +
        '<div><span>模型胜率</span><b>' + Math.round(Number(best[1]) * 100) + "%</b></div>" +
        '<div><span>金差</span><b class="' + (best[2] - best[3] >= 0 ? "up" : "down") + '">' + kFmt(best[2] - best[3]) + "</b></div>" +
        '<div><span>击杀</span><b>' + best[4] + ":" + best[5] + "</b></div>" +
        '<div><span>事件</span><b>' + (evs.length ? evs.map(function (e) { return K.esc(e.label); }).join(" · ") : "—") + "</b></div>";
    }

    function teamSeries(idx) {
      return [
        { name: h.t1, color: CP.mark, pts: pts.map(function (r) { return [r[0], r[idx]]; }) },
        { name: h.t2, color: CP.line, pts: pts.map(function (r) { return [r[0], r[idx + 1]]; }) }
      ];
    }

    function draw(id) {
      var el2 = document.getElementById("curveChart");
      var note = document.getElementById("curveNote");
      curTab = id;
      var common = {
        height: 420, yTicks: 5, events: curveEvents,
        onHover: function (d) { updateSummary(d.m); },
        xEvery: Math.max(1, Math.ceil((pts[pts.length - 1][0] - pts[0][0]) / 6))
      };
      if (id === "win") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max(1, Math.max.apply(null, pts.map(function (r) { return Number(r[1]); })))],
          yFmt: function (v) { return Math.round(v * 100) + "%"; },
          refLines: [{ v: 0.5, label: "五五开", color: "#8FA0B8", opacity: 0.55 }],
          series: [{ name: h.t1 + " 胜率", color: CP.mark, fill: true, fillOpacity: 0.18,
                     pts: pts.map(function (r) { return [r[0], r[1]]; }) }]
        }));
        note.textContent = "模型对 " + h.t1 + " 的实时胜率推算；紫色竖线为官方 / 结构性事件。";
      } else if (id === "eco") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max.apply(null, pts.map(function (r) { return Math.max(Number(r[2]), Number(r[3])); })) * 1.08],
          yFmt: absFmt,
          series: teamSeries(2)
        }));
        note.textContent = "两队总经济随比赛发展；差值看「经济差」页签更直观。";
      } else if (id === "gd") {
        var diffs = pts.map(function (r) { return Number(r[2]) - Number(r[3]); });
        var maxAbs = Math.max(1000, Math.max.apply(null, diffs.map(Math.abs))) * 1.12;
        var ser = [{ name: "实际经济差", color: CP.mark, fill: true, fillOpacity: 0.16,
                     pts: pts.map(function (r) { return [r[0], Number(r[2]) - Number(r[3])]; }) }];
        if ((h.gpred || []).length >= 3) {
          ser.push({ name: "5 分钟前外推", color: CP.label, dash: true, width: 1.8, pts: h.gpred });
        }
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [-maxAbs, maxAbs], yFmt: kFmt,
          refLines: [{ v: 0, label: "均势", color: "#8FA0B8", opacity: 0.55 }],
          series: ser
        }));
        note.textContent = "主系列是实际金差；虚线是用 5 分钟前走势外推的对照，两者贴合度越高节奏越稳定。";
      } else if (id === "kill") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max.apply(null, pts.map(function (r) { return Math.max(Number(r[4]), Number(r[5])); })) * 1.12],
          yFmt: Math.round, series: teamSeries(4)
        }));
        note.textContent = "两队累计击杀；早期波动大，建议结合经济差看。";
      } else if (id === "tower") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max.apply(null, pts.map(function (r) { return Math.max(Number(r[6]), Number(r[7])); })) * 1.12],
          yFmt: Math.round, series: teamSeries(6)
        }));
        note.textContent = "两队累计推塔；推进节奏通常比单点击杀更能解释胜率摆动。";
      } else if (id === "res") {
        drawResources(el2, note);
      } else {
        drawLanes(el2, note, id);
      }
      updateSummary(pts[pts.length - 1][0]);
    }

    function drawResources(el2, note) {
      var names = ["暴君", "黑暗暴君", "主宰", "风暴龙王"];
      var maxV = 1;
      pts.forEach(function (r) {
        for (var i = 0; i < 4; i++) maxV = Math.max(maxV, Number(r[8 + i * 2]), Number(r[9 + i * 2]));
      });
      el2.innerHTML = '<div class="rp-sm-grid">' + names.map(function (nm, i) {
        return '<div class="rp-sm"><div class="rp-sm-t mono">' + nm + '</div><div class="rp-sm-c" id="resc' + i + '"></div></div>';
      }).join("") + "</div>";
      names.forEach(function (nm, i) {
        var base = 8 + i * 2;
        K.lineChart(document.getElementById("resc" + i), {
          height: 240, yTicks: 4, xEvery: Math.max(1, Math.ceil((pts[pts.length - 1][0] - pts[0][0]) / 5)),
          yDomain: [0, maxV * 1.08], yFmt: Math.round,
          series: [
            { name: h.t1, color: CP.mark, width: 2.2, pts: pts.map(function (r) { return [r[0], r[base]]; }) },
            { name: h.t2, color: CP.line, width: 2.2, pts: pts.map(function (r) { return [r[0], r[base + 1]]; }) }
          ]
        });
      });
      note.textContent = "四类中立资源共享同一纵轴，方便横向比较控制量；不把 8 条线挤进一张图。";
    }

    function lanePairs() {
      if (!laneNames || laneNames.length !== 10) return null;
      var pairs = [];
      var idxOf = function (nm) {
        for (var k = 0; k < (h.names || []).length; k++) if (h.names[k] === nm) return k;
        return -1;
      };
      for (var i = 0; i < 5; i++) {
        var a = idxOf(laneNames[i]), b = idxOf(laneNames[i + 5]);
        if (a < 0 || b < 0) return null;
        pairs.push({ lane: LANES[i], a: a, b: b, n1: laneNames[i], n2: laneNames[i + 5] });
      }
      return pairs;
    }

    function drawLanes(el2, note, mode) {
      var pairs = lanePairs();
      var isGold = mode === "player" || mode === "playerDiff";
      var isDiff = mode === "playerDiff" || mode === "dmgDiff";
      var what = isGold ? "个人经济" : "累计输出伤害";
      if (!pairs) {
        var C1 = ["#FFFFFF", "#E8A33D", "#D98A2B", "#C47421", "#A85F1A"];
        var C2 = ["#9DB2CC", "#8AA2BE", "#2E71B0", "#225A94", "#174378"];
        var valAt = function (i3, r) { return isGold ? (r[12 + i3 * 2] || 0) : (r[12 + i3 * 2 + 1] || 0); };
        var ser = [];
        for (var i2 = 0; i2 < 10; i2++) {
          (function (i3) {
            ser.push({
              name: (h.names && h.names[i3]) || ("P" + (i3 + 1)),
              color: ((h.pcamp && h.pcamp[i3] === 2) ? C2 : C1)[i3 % 5],
              pts: pts.map(function (r) { return [r[0], valAt(i3, r)]; }), width: 1.7
            });
          })(i2);
        }
        K.lineChart(el2, { height: 380, yFmt: absFmt, series: ser });
        note.textContent = "10 名选手的" + what + "曲线（金系 = " + h.t1 + "，蓝系 = " + h.t2 +
          "）· 本局无分钟级复盘名单，无法做同位置对位";
        return;
      }
      var sharedMax = 1, diffMax = 1;
      pairs.forEach(function (pk) {
        pts.forEach(function (r) {
          var a = isGold ? Number(r[12 + pk.a * 2] || 0) : Number(r[12 + pk.a * 2 + 1] || 0);
          var b = isGold ? Number(r[12 + pk.b * 2] || 0) : Number(r[12 + pk.b * 2 + 1] || 0);
          sharedMax = Math.max(sharedMax, a, b);
          diffMax = Math.max(diffMax, Math.abs(a - b));
        });
      });
      sharedMax *= 1.08;
      diffMax *= 1.12;
      el2.innerHTML = '<div class="rp-sm-grid">' + pairs.map(function (pk, i) {
        return '<div class="rp-sm"><div class="rp-sm-t mono">' + pk.lane + " · " + esc(pk.n1) + " vs " + esc(pk.n2) + "</div>" +
          '<div class="rp-sm-c" id="smc' + i + '"></div></div>';
      }).join("") + "</div>";
      pairs.forEach(function (pk, i) {
        if (isDiff) {
          K.lineChart(document.getElementById("smc" + i), {
            height: 280, yTicks: 4, yDomain: [-diffMax, diffMax], yFmt: kFmt,
            xEvery: Math.max(1, Math.ceil((pts[pts.length - 1][0] - pts[0][0]) / 5)),
            series: [{
              name: pk.n1 + " − " + pk.n2,
              color: CP.mark, fill: true, fillOpacity: 0.16, width: 2.4,
              pts: pts.map(function (r) {
                var a = isGold ? Number(r[12 + pk.a * 2] || 0) : Number(r[12 + pk.a * 2 + 1] || 0);
                var b = isGold ? Number(r[12 + pk.b * 2] || 0) : Number(r[12 + pk.b * 2 + 1] || 0);
                return [r[0], a - b];
              })
            }],
            refLines: [{ v: 0, color: "#8FA0B8", opacity: 0.55 }]
          });
        } else {
          K.lineChart(document.getElementById("smc" + i), {
            height: 280, yTicks: 4, yDomain: [0, sharedMax], yFmt: absFmt,
            xEvery: Math.max(1, Math.ceil((pts[pts.length - 1][0] - pts[0][0]) / 5)),
            series: [
              { name: pk.n1, color: "#F6C021", width: 2.4,
                pts: pts.map(function (r) { return [r[0], isGold ? Number(r[12 + pk.a * 2] || 0) : Number(r[12 + pk.a * 2 + 1] || 0)]; }) },
              { name: pk.n2, color: "#8FC7F0", width: 2.4,
                pts: pts.map(function (r) { return [r[0], isGold ? Number(r[12 + pk.b * 2] || 0) : Number(r[12 + pk.b * 2 + 1] || 0)]; }) }
            ]
          });
        }
      });
      note.textContent = isDiff
        ? "五张小图共享对称纵轴；0 线上方 = " + h.t1 + " 领先，可直接比较哪条分路差距最大。"
        : "五张小图共享纵轴（金 = " + h.t1 + "，蓝 = " + h.t2 + "），顺序 对抗路→游走。";
    }

    function bindTabs() {
      ["#curveTabsTeam", "#curveTabsLane"].forEach(function (sel) {
        var tabs = document.querySelector(sel);
        if (!tabs) return;
        tabs.addEventListener("click", function (e) {
          var b = e.target.closest("button"); if (!b) return;
          Array.prototype.forEach.call(tabs.children, function (x) { x.classList.toggle("on", x === b); });
          var other = sel === "#curveTabsTeam" ? "#curveTabsLane" : "#curveTabsTeam";
          var otherTabs = document.querySelector(other);
          if (otherTabs) Array.prototype.forEach.call(otherTabs.children, function (x) { x.classList.remove("on"); });
          draw(b.getAttribute("data-t"));
        });
      });
    }
    bindTabs();
    draw("win");

}
})();
</script>
</body>
</html>
