<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战队 · KPL 数据中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230A111C'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='none' stroke='%23F6C021' stroke-width='2'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='16' font-weight='bold' fill='%23F6C021' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=51">
<link rel="stylesheet" href="assets/pages.css?v=51">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KPL 数据中心">
<meta property="og:title" content="战队 · KPL 数据中心">
<meta property="og:description" content="KPL 赛事数据产品：赛程比分、战队/选手/英雄数据、BP 分析、逐局复盘与实时胜率预测。2019–2026 全历史。">
<meta property="og:image" content="https://kpldata-site.hccccc01333.workers.dev/assets/shots/02-live.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="teams.html">
<header id="siteHeader"></header>

<header class="page-hero">
  <div class="wrap">
    <div class="ph-kicker mono">TEAMS · 战队</div>
    <h1>战队战力榜</h1>
    <p>2019–2026 所有战队的历史战绩，按胜率排名。可用上方「数据范围」切换年份或单个赛事，
      展开卡片查看阵容名单；想看两队的历史恩怨，直接用
      <a href="h2h.html" style="color:var(--gold);font-weight:700">「交手记录」</a> 对起来查。</p>
    <div class="ph-meta mono">
      <span>战队 <b id="tCount">—</b></span><i>/</i>
      <span>范围对局 <b id="tGames">—</b></span><i>/</i>
      <span>数据时钟 <b id="genAt">—</b></span>
    </div>
  </div>
</header>

<main class="wrap" style="margin-top:22px">
  <section class="block" style="margin-top:0">
    <div class="block-head">
      <h2><i></i>冠军墙</h2>
      <span class="block-note mono">历届冠军（2019 年起 · 未决出的赛事标注领先方）</span>
    </div>
    <div class="champ-strip" id="champStrip"></div>
  </section>
  <div class="scopebar" id="scopeBar"></div>
  <div class="brief" id="brief"></div>
  <div class="filterbar">
    <label class="fld"><span>最少场次</span>
      <select id="fMin">
        <option value="0" selected>不限（全部展示）</option>
        <option value="10">≥ 10 局</option>
        <option value="50">≥ 50 局</option>
        <option value="200">≥ 200 局</option>
      </select>
    </label>
    <span class="block-note mono" id="countNote"></span>
    <button class="btn ghost sm" id="expBtn" type="button">导出 CSV</button>
  </div>
  <div class="team-grid" id="teamGrid"></div>
</main>

<footer id="siteFooter" class="footer"></footer>

<script src="assets/data.js?v=51"></script>
<script src="assets/seasons.js?v=51"></script>
<script src="assets/common.js?v=51"></script>
<script>
(function () {
  "use strict";
  var D = KPL.data, K = KPL, $ = function (s) { return document.querySelector(s); };
  K.init();
  $("#genAt").textContent = D.generatedAt;

  var curScope = "all";

  function membersFor(scopeData, team) {
    return (scopeData.players || []).filter(function (p) { return p.team === team; })
      .sort(function (a, b) { return b.games - a.games; }).slice(0, 8);
  }

  function render() {
    var d = K.scopeOf(curScope);
    var min = parseInt($("#fMin").value, 10) || 0;
    var teams = (d.teams || []).filter(function (t) { return t.games >= min; });
    teams = teams.slice().sort(function (a, b) { return b.wr - a.wr || b.games - a.games; });
    $("#tCount").textContent = teams.length;
    $("#tGames").textContent = K.fmtInt(teams.reduce(function (a, t) { return a + t.games; }, 0));
    $("#countNote").textContent = "共 " + teams.length + " 支战队（" + K.scopeName(curScope) + "）";

    $("#teamGrid").innerHTML = teams.map(function (t, i) {
      var tier = K.tierOf(t.wr);
      var members = membersFor(d, t.team).map(function (m) {
        return '<a href="players.html?q=' + encodeURIComponent(m.name) + '">' + K.esc(m.name) +
          '<span class="w">' + m.games + "局 " + K.pct(m.wr, 0) + "</span></a>";
      }).join("");
      return '<div class="tcard reveal" style="transition-delay:' + Math.min(i * 30, 240) + 'ms">' +
        '<div class="top"><span class="rk' + (i < 3 ? " r" + (i + 1) : "") + '">' + (i + 1) + "</span>" +
        (t.icon ? '<img class="ic" src="' + K.esc(t.icon) + '" alt="" loading="lazy">' : "") +
        '<div><div class="nm"><a href="team.html?id=' + encodeURIComponent(t.team) + '" style="color:inherit">' +
        K.esc(t.team) + "</a></div>" + '<div class="rec">大场 ' + t.mWin + "-" + t.mLoss +
        " · " + t.games + " 局</div></div>" +
        '<span class="tier ' + tier + '" style="margin-left:auto">' + tier + "</span></div>" +
        '<div class="nums">' +
        '<div class="num-cell"><div class="k">单局胜率</div><div class="v">' + K.pct(t.wr) + "</div></div>" +
        '<div class="num-cell"><div class="k">场均金差</div><div class="v">' + K.signed(t.goldDiff) + "</div></div>" +
        '<div class="num-cell"><div class="k">已打局数</div><div class="v">' + t.games + "</div></div>" +
        "</div>" +
        '<span class="wr-bar" style="width:100%;display:block"><span class="wr-dot" style="left:' +
        (t.wr * 100).toFixed(1) + '%"></span></span>' +
        '<details><summary>阵容名单</summary>' +
        (members ? '<div class="members">' + members + "</div>"
                 : '<div class="block-note mono" style="margin-top:8px">该范围暂无选手明细</div>') +
        "</details></div>";
    }).join("");
    /* 数据简报 */
    if (teams.length) {
      var mainT = teams.filter(function (t) { return t.games >= 30; });
      var top = (mainT.length ? mainT : teams).slice().sort(function (a, b) { return b.wr - a.wr; })[0];
      var gTop = teams.slice().sort(function (a, b) { return b.goldDiff - a.goldDiff; })[0];
      K.brief("#brief", "当前范围共 <b>" + teams.length + "</b> 支战队、<b>" + K.fmtInt(teams.reduce(function (a, t) { return a + t.games; }, 0)) +
        "</b> 局比赛。" + K.scopeName(curScope) + "胜率最高的是 <b>" + K.esc(top.team) + "</b>（<b>" + K.pct(top.wr, 1) + "</b>，" + top.games +
        " 局）；场均经济差最强的是 <b>" + K.esc(gTop.team) + "</b>（<b>" + K.signed(gTop.goldDiff) + "</b>）。展开任意战队卡片可看阵容名单。");
    } else {
      K.brief("#brief", "当前条件下没有战队数据，试试放宽筛选。");
    }
    K.refresh();
  }

  /* 冠军墙 */
  (function () {
    var LG = ((window.KPL_SEASONS || {}).leagues || []).slice()
      .sort(function (a, b) { return String(b.id).localeCompare(String(a.id)); });
    var ic = {};
    ((K.scopeOf("all") || {}).teams || []).forEach(function (t) { ic[t.team] = t.icon; });
    document.getElementById("champStrip").innerHTML = LG.map(function (l) {
      var name = l.champion || l.champLeader || "";
      var pending = !l.champion;
      var me = (K.scopeOf("all").teams || []).filter(function (t) { return t.team === name; })[0] || {};
      return '<a class="champ' + (pending ? " pending" : "") + '" href="h2h.html" title="' + K.esc(l.name) + '">' +
        (me.icon ? '<img src="' + K.esc(me.icon) + '" alt="" loading="lazy">' : "") +
        "<div><b>" + K.esc(name || "待定") + (pending ? ' <em class="mono">领先中</em>' : "") + "</b>" +
        "<span>" + K.esc(l.name) + "</span></div></a>";
    }).join("");
  })();
  $("#fMin").addEventListener("change", render);
  $("#expBtn").addEventListener("click", function () {
    var d = K.scopeOf(curScope);
    var min = parseInt($("#fMin").value, 10) || 0;
    var teams = (d.teams || []).filter(function (t) { return t.games >= min; })
      .slice().sort(function (a, b) { return b.wr - a.wr || b.games - a.games; });
    var rows = [["排名", "战队", "大场胜", "大场负", "局数", "局胜", "单局胜率", "场均金差", "场均击杀差", "范围"]];
    teams.forEach(function (t, i) {
      rows.push([i + 1, t.team, t.mWin, t.mLoss, t.games, t.wins, (t.wr * 100).toFixed(1) + "%", t.goldDiff, t.killDiff, K.scopeName(curScope)]);
    });
    K.exportCSV("战队榜_" + K.scopeName(curScope) + ".csv", rows);
  });
  render();
})();
</script>
</body>
</html>
