<body data-page="compare.html" class="v2-page cmp-page compare-page">
<header id="siteHeader" class="topbar"></header>

<header class="lg-hero">
  <div class="lg-hero-gridlines" aria-hidden="true"></div>
  <div class="v2-wrap">
    <div class="v2-kicker"><i></i>COMPARE<b>·</b>英雄对比</div>
    <h1 class="v2-h1">英雄对比</h1>
    <p class="v2-lead">默认把<b>当前数据范围内出场最多的 3 个英雄</b>放在一起，下方即刻给出雷达与原始数字；想换对象就在「高级条件」里改。
      雷达按<b>当前范围内全部合格英雄的分位</b>归一化（越靠外越强），虚线为加权范围均值。也可切「趋势视图」看某几个英雄逐年胜率 / 禁用率。
      想看战队？用 <a href="compare-team.html" style="color:var(--gold);font-weight:700">「战队对比」</a>；
      想看选手或分路？用 <a href="compare-player.html" style="color:var(--gold);font-weight:700">「选手对比」</a>
      / <a href="compare-lane.html" style="color:var(--gold);font-weight:700">「位置对比」</a>；
      看两个赛段之间的变化？用 <a href="stage.html" style="color:var(--gold);font-weight:700">「赛段对比」</a>。</p>
    <div class="v2-stats lg-kpis" style="margin-top:26px">
      <div class="v2-stat"><b class="v2-mono" id="cmpCount">—</b><span>参与对比英雄</span></div>
      <div class="v2-stat"><b class="v2-mono" id="cmpScope">—</b><span>数据范围</span></div>
      <div class="v2-stat"><b class="v2-mono" id="cmpClock">—</b><span>数据时钟</span></div>
    </div>
  </div>
</header>

<main class="wrap" style="margin-top:26px">
  <div class="scopebar" id="scopeBar"></div>

  <div class="filterbar">
    <label class="fld" id="trendWrap"><span>视图</span>
      <label class="wb-toggle"><input type="checkbox" id="trendToggle"> 趋势视图（逐年）</label>
    </label>
    <label class="fld" id="metricWrap" style="display:none"><span>趋势指标</span>
      <select id="trendMetric">
        <option value="wr" selected>胜率</option>
        <option value="ban">禁用率</option>
      </select>
    </label>
    <div class="pickers" id="pickers"></div>
  </div>

  <div class="cmp-grid">
    <div class="cmp-radar">
      <div class="cmp-cap"><b>对比图表</b><em>RADAR / TREND</em></div>
      <div id="radar"></div>
      <div class="cmp-legend" id="legend"></div>
    </div>
    <div class="cmp-table">
      <div class="cmp-cap"><b>数值对照</b><em>RAW DATA</em></div>
      <table id="cmpTable"></table>
      <div class="cmp-tip" id="cmpTip"></div>
    </div>
  </div>
</main>

<script src="assets/compare.js?v=20261031c"></script>
<script>
KPL_COMPARE.init("hero");
SHARE.mount(document.querySelector(".filterbar"), KPL_COMPARE.spec, "kpl-compare-hero.png");

/* V2 hero KPI（只读现有 DOM 与站点公共 API，不改 compare.js 的渲染与交互）：
   参与对比对象数 / 数据范围 / 数据时钟，随范围切换与对象选择同步。 */
(function () {
  "use strict";
  function sync() {
    var sels = document.querySelectorAll("#pickers select"), n = 0, i;
    for (i = 0; i < sels.length; i++) if (sels[i].value) n++;
    var c = document.getElementById("cmpCount");
    if (c) c.textContent = n;
    var scope = "all";
    try { scope = localStorage.getItem("kpl_scope_v1") || "all"; } catch (e) {}
    var s = document.getElementById("cmpScope");
    if (s) s.textContent = KPL.scopeName(scope);
  }
  var clock = document.getElementById("cmpClock");
  if (clock) clock.textContent = KPL.data.generatedAt;
  sync();
  var host = document.getElementById("pickers");
  if (host) host.addEventListener("change", function () { setTimeout(sync, 0); });
  var bar = document.getElementById("scopeBar");
  if (bar) bar.addEventListener("change", function () { setTimeout(sync, 0); });
})();
</script>
