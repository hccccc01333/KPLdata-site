<body data-page="heroes.html" class="v2-page board-page heroes-page">
<header id="siteHeader" class="topbar"></header>

<header class="lg-hero">
  <div class="lg-hero-gridlines" aria-hidden="true"></div>
  <div class="v2-wrap">
    <div class="v2-kicker"><i></i>HEROES<b>·</b>英雄</div>
    <h1 class="v2-h1">英雄图鉴与对位</h1>
    <p class="v2-lead">每个英雄的出场次数、胜率与禁用率，按强度分为 S/A/B/C 四档；同位置对位来自历史比赛记录，场次太少的会标注「样本不足」。</p>
    <div class="v2-stats lg-kpis" style="margin-top:26px">
      <div class="v2-stat"><b class="v2-mono" id="hCount">—</b><span>图鉴英雄</span></div>
      <div class="v2-stat"><b class="v2-mono" id="hGames">—</b><span>选用记录</span></div>
      <div class="v2-stat"><b class="v2-mono" id="genAt">—</b><span>数据时钟</span></div>
    </div>
  </div>
</header>

<main class="wrap" style="margin-top:26px">
  <div class="scopebar" id="scopeBar"></div>
  <div class="brief" id="brief"></div>
  <div class="filterbar">
    <label class="fld grow"><span>搜索英雄</span>
      <input class="search" id="fQ" placeholder="输入英雄名，如 戈娅">
    </label>
    <label class="fld"><span>档位</span>
      <select id="fTier">
        <option value="">全部档位</option>
        <option>S</option><option>A</option><option>B</option><option>C</option>
      </select>
    </label>
    <span class="block-note mono" id="countNote"></span>
    <button class="btn ghost sm" id="expBtn" type="button">导出 CSV</button>
  </div>
  <div class="hero-grid" id="heroGrid"></div>
  <div class="board-more">
    <button class="v2-btn sm" id="moreBtn" type="button" hidden>显示更多</button>
    <span class="board-more-note mono" id="moreNote"></span>
  </div>

  <div class="block-head sub-head">
    <h2><i></i>热度 × 强度象限 <em class="mono">横轴 = 出场率 · 纵轴 = 胜率 · 气泡大小 = 禁用率</em></h2>
  </div>
  <div class="scroll-hint">左右滑动查看完整象限图 →</div>
  <div class="panel"><div id="scatter"></div></div>

  <div class="block-head sub-head">
    <h2><i></i>同位置对位 <em class="mono">同一局里蓝方与红方同位置英雄的交手记录 · 基于 2026 夏季赛与年度总决赛</em></h2>
    <div class="seg" id="muTabs"></div>
  </div>
  <div class="scroll-hint">左右滑动查看完整表格 →</div>
  <div class="panel table-panel">
    <table class="tbl">
      <thead><tr><th>蓝方英雄</th><th>红方英雄</th><th class="num">对位局数</th><th class="num">蓝方胜率</th><th>胜率区间</th><th>判定</th></tr></thead>
      <tbody id="muBody"></tbody>
    </table>
  </div>
</main>

<footer id="siteFooter" class="footer"></footer>

<script src="assets/data.js?v=85"></script>
<script src="assets/details.js?v=85"></script>
<script src="assets/seasons.js?v=85"></script>
<script src="assets/common.js?v=20261110-curve"></script>
<script>
(function () {
  "use strict";
  var D = KPL.data, K = KPL, $ = function (s) { return document.querySelector(s); };
  K.init();
  $("#genAt").textContent = D.generatedAt;

  var curScope = "all";
  var shown = 24;

  function heroCardFrom(h, i) {
    return K.heroCard(h, i);
  }

  function render() {
    var d = K.scopeOf(curScope);
    var q = $("#fQ").value.trim(), tier = $("#fTier").value;
    var rows = (d.heroes || []).filter(function (h) {
      if (q && h.name.indexOf(q) < 0) return false;
      if (tier && h.tier !== tier) return false;
      return true;
    });
    $("#hCount").textContent = rows.length;
    $("#hGames").textContent = K.fmtInt(rows.reduce(function (a, h) { return a + h.games; }, 0));
    $("#countNote").textContent = "共 " + rows.length + " 个英雄 · " + K.scopeName(curScope) + " · 点击卡片查看详情";
    var visible = rows.slice(0, shown);
    $("#heroGrid").innerHTML = visible.length ? visible.map(heroCardFrom).join("")
      : '<div class="empty-tip">没有符合条件的英雄</div>';
    var moreBtn = $("#moreBtn");
    if (moreBtn) {
      if (rows.length > shown) {
        moreBtn.hidden = false;
        moreBtn.textContent = "显示更多（已显示 " + Math.min(shown, rows.length) + " / " + rows.length + " 个）";
      } else {
        moreBtn.hidden = true;
      }
    }
    renderScatter(d);
    /* 数据简报 */
    var main = (d.heroes || []).filter(function (h) { return h.games >= 30; });
    if (main.length) {
      var bW = main.slice().sort(function (a, b) { return b.wr - a.wr; })[0];
      var bB = (d.heroes || []).slice().sort(function (a, b) { return b.bans - a.bans; })[0];
      var bG = (d.heroes || []).slice().sort(function (a, b) { return b.games - a.games; })[0];
      K.brief("#brief", K.scopeName(curScope) + "：超过 30 局的英雄里，胜率最高的是 <b>" + K.esc(bW.name) + "</b>（<b>" + K.pct(bW.wr, 1) +
        "</b>，" + bW.games + " 局）；最常被禁的是 <b>" + K.esc(bB.name) + "</b>（<b>" + bB.bans + "</b> 次）；出场最多的是 <b>" +
        K.esc(bG.name) + "</b>（<b>" + bG.games + "</b> 局）。点开任意英雄看选手使用榜与常见出装。");
    }
    K.refresh();
  }

  /* 出场率 × 胜率 散点象限 */
  var CP = K.chartPalette();
  /* 档位色直接读 V2 令牌，亮/暗主题各自可见：S=金（版本答案）、A=蓝、B=石板、C=灰 */
  function cssToken(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  var TIER_COLOR = {
    S: cssToken("--v2-gold") || CP.mark,
    A: cssToken("--v2-blue") || CP.line,
    B: cssToken("--v2-ink-2") || CP.label,
    C: cssToken("--v2-ink-3") || CP.grid
  };
  function quantile(arr, p) {
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var i = (a.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return a[lo] + (a[hi] - a[lo]) * (i - lo);
  }
  function renderScatter(d) {
    var el = document.getElementById("scatter");
    if (!el) return;
    var battles = (d.totals && d.totals.battles) || 1;
    var pts = (d.heroes || []).filter(function (h) { return h.games >= 5; }).map(function (h) {
      return { name: h.name, tier: h.tier, pick: h.games / battles, wr: h.wr, ban: h.bans / battles };
    });
    if (pts.length < 4) { el.innerHTML = '<div class="empty-tip">样本不足，暂不绘制</div>'; return; }
    var xs = pts.map(function (p) { return p.pick; });
    var ys = pts.map(function (p) { return p.wr; });
    var xMax = Math.max.apply(null, xs) * 1.06;
    /* 纵轴：少量低场次极端胜率会把 95% 的点压成一条线，
       所以按 10%~90% 分位收敛视野，越界点贴边画空心圈（tooltip 保留真值）。*/
    var rawLo = Math.min.apply(null, ys), rawHi = Math.max.apply(null, ys);
    var q10 = quantile(ys, 0.10), q90 = quantile(ys, 0.90);
    var clipped = false, yLo, yHi;
    if (rawHi - rawLo > 0.16 && q90 - q10 < (rawHi - rawLo) * 0.62) {
      clipped = true;
      yLo = Math.floor((q10 - 0.012) * 40) / 40;
      yHi = Math.ceil((q90 + 0.012) * 40) / 40;
    } else {
      yLo = Math.floor((rawLo - 0.012) * 40) / 40;
      yHi = Math.ceil((rawHi + 0.012) * 40) / 40;
    }
    var W = 1040, H = 400, P = { l: 56, r: 24, t: 24, b: 46 };
    var plotW = W - P.l - P.r, plotH = H - P.t - P.b;
    var X = function (v) { return P.l + v / xMax * plotW; };
    var Y = function (v) { return P.t + (1 - (v - yLo) / (yHi - yLo)) * plotH; };
    var clampY = function (v) { return Math.min(yHi, Math.max(yLo, v)); };
    var sx = xs.slice().sort(function (a, b) { return a - b; });
    var xMed = sx[Math.floor(sx.length / 2)];
    var s2 = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="热度强度象限图">';
    /* 横向网格：2.5% 一格，5% 标注一次 */
    var step = 0.025;
    for (var gv = Math.ceil(yLo / step) * step; gv <= yHi + 1e-9; gv += step) {
      var gy = Y(gv), isLabel = Math.abs(Math.round(gv / 0.05) * 0.05 - gv) < 1e-9;
      s2 += '<line x1="' + P.l + '" y1="' + gy.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + gy.toFixed(1) +
        '" stroke=' + CP.grid + ' stroke-dasharray="' + (isLabel ? "4 6" : "1 7") + '"/>';
      if (isLabel) {
        s2 += '<text x="' + (P.l - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill=' + CP.label +
          ' font-family="Inter,monospace">' + Math.round(gv * 100) + "%</text>";
      }
    }
    for (var k = 0; k <= 4; k++) {
      var xv = xMax * k / 4;
      s2 += '<text x="' + X(xv).toFixed(1) + '" y="' + (H - 18) + '" text-anchor="middle" font-size="10.5" fill=' + CP.label +
        ' font-family="Inter,monospace">' + (xv * 100).toFixed(0) + "%</text>";
    }
    s2 += '<line x1="' + X(xMed).toFixed(1) + '" y1="' + P.t + '" x2="' + X(xMed).toFixed(1) + '" y2="' + (H - P.b) + '" stroke=' + CP.axis + ' />' +
      '<text x="' + (X(xMed) + 6).toFixed(1) + '" y="' + (P.t + 13) + '" font-size="10.5" fill=' + CP.label + ' font-family="Inter,monospace" paint-order="stroke" stroke="' + CP.dot + '" stroke-width="3">出场率中位</text>';
    if (yLo < 0.5 && yHi > 0.5) {
      s2 += '<line x1="' + P.l + '" y1="' + Y(0.5).toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + Y(0.5).toFixed(1) + '" stroke=' + CP.axis + ' />' +
        '<text x="' + (P.l + 6) + '" y="' + (Y(0.5) - 7).toFixed(1) + '" font-size="10.5" fill=' + CP.label + ' font-family="Inter,monospace" paint-order="stroke" stroke="' + CP.dot + '" stroke-width="3">50% 胜率线</text>';
    }
    /* 点：按禁用率升序画（大点在上），越界点贴边空心 */
    pts.sort(function (a, b) { return a.ban - b.ban; });
    var labels = pts.slice().sort(function (a, b) { return b.pick - a.pick; }).slice(0, 10);
    var placed = [];
    function free(x, y, w, h) {
      if (x < P.l + 2 || x + w > W - P.r - 2 || y < P.t + 2 || y + h > H - P.b - 2) return false;
      for (var i = 0; i < placed.length; i++) {
        var r = placed[i];
        if (!(x + w < r.x || x > r.x + r.w || y + h < r.y || y > r.y + r.h)) return false;
      }
      return true;
    }
    var labelPos = {};
    labels.forEach(function (p2) {
      var w = p2.name.length * 11.5 + 4, h = 15;
      var cx = X(p2.pick), cy = Y(clampY(p2.wr)), r = 3.5 + Math.min(p2.ban * 46, 13);
      var cand = [
        { x: cx - w / 2, y: cy - r - h - 3 },
        { x: cx - w / 2, y: cy + r + 3 },
        { x: cx + r + 5, y: cy - h / 2 },
        { x: cx - r - 5 - w, y: cy - h / 2 }
      ];
      for (var i = 0; i < cand.length; i++) {
        if (free(cand[i].x, cand[i].y, w, h)) {
          placed.push({ x: cand[i].x, y: cand[i].y, w: w, h: h });
          labelPos[p2.name] = cand[i];
          return;
        }
      }
    });
    pts.forEach(function (p2) {
      var r = 3.5 + Math.min(p2.ban * 46, 13);
      var cy = Y(clampY(p2.wr)), out = clipped && (p2.wr > yHi || p2.wr < yLo);
      var col = TIER_COLOR[p2.tier] || "#9FB3CE";
      s2 += '<circle cx="' + X(p2.pick).toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + col +
        '" fill-opacity="' + (out ? ".10" : ".62") + '" stroke="' + col + '" stroke-width="1.4"' +
        (out ? ' stroke-dasharray="2 2"' : "") + '>' +
        "<title>" + K.esc(p2.name) + " · 出场率 " + (p2.pick * 100).toFixed(1) + "% · 胜率 " + (p2.wr * 100).toFixed(1) +
        "% · 禁用率 " + (p2.ban * 100).toFixed(1) + "% · " + p2.tier + " 档" + (out ? "（超出纵轴范围，已贴边）" : "") + "</title></circle>";
    });
    /* 标签最后画，避免被气泡盖住 */
    Object.keys(labelPos).forEach(function (nm) {
      var c = labelPos[nm];
      s2 += '<text x="' + (c.x + 2).toFixed(1) + '" y="' + (c.y + 11.5).toFixed(1) + '" font-size="10.5" fill="' + CP.onLine +
        '" font-family="Inter,PingFang SC,sans-serif" paint-order="stroke" stroke="' + CP.dot + '" stroke-width="3">' + K.esc(nm) + "</text>";
    });
    s2 += "</svg>";
    el.innerHTML = '<div class="lc-legend"><span><i style="background:' + TIER_COLOR.S + '"></i>S 档</span>' +
      '<span><i style="background:' + TIER_COLOR.A + '"></i>A 档</span><span><i style="background:' + TIER_COLOR.B + '"></i>B 档</span>' +
      '<span><i style="background:' + TIER_COLOR.C + '"></i>C 档</span>' +
      '<span>右上角 = 又热又强（版本答案）</span>' +
      (clipped ? '<span>空心点 = 极端值贴边显示</span>' : "") + "</div>" +
      '<div class="sc-scroll">' + s2 + "</div>";
  }
  curScope = K.scopeBar("#scopeBar", function (id) { curScope = id; shown = 24; render(); });
  $("#expBtn").addEventListener("click", function () {
    var d = K.scopeOf(curScope);
    var q = $("#fQ").value.trim(), tier = $("#fTier").value;
    var rows2 = (d.heroes || []).filter(function (h) {
      if (q && h.name.indexOf(q) < 0) return false;
      if (tier && h.tier !== tier) return false;
      return true;
    });
    var rows = [["英雄", "档位", "出场", "胜率", "禁用数", "KDA", "输出占比", "承伤占比", "场均经济", "范围"]];
    rows2.forEach(function (h2) {
      rows.push([h2.name, h2.tier, h2.games,
        h2.wr != null ? K.pct(h2.wr, 1) : "—",
        h2.bans != null ? h2.bans : "—",
        h2.kda != null ? h2.kda : "—", h2.dmg != null ? h2.dmg : "—",
        h2.bh != null ? h2.bh : "—", h2.gold != null ? h2.gold : "—",
        K.scopeName(curScope)]);
    });
    K.exportCSV("英雄榜_" + K.scopeName(curScope) + ".csv", rows);
  });
  ["fQ", "fTier"].forEach(function (id) {
    $("#" + id).addEventListener(id === "fQ" ? "input" : "change", function () { shown = 24; render(); });
  });
  $("#moreBtn").addEventListener("click", function () { shown += 24; render(); });
  render();

  /* 对位表 */
  var POS = Object.keys(D.matchups || {});
  if (POS.length) {
    $("#muTabs").innerHTML = POS.map(function (p, i) {
      return '<button data-pos="' + K.esc(p) + '" class="' + (i === 0 ? "on" : "") + '">' + K.esc(p) + "</button>";
    }).join("");
    $("#muTabs").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
      $("#muBody").innerHTML = K.muBody(D.matchups[b.getAttribute("data-pos")] || []);
    });
    $("#muBody").innerHTML = K.muBody(D.matchups[POS[0]] || []);
  }
})();
</script>
</body>
</html>
