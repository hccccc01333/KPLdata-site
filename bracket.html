<body data-page="bracket.html" class="br-page">
<header id="siteHeader" class="topbar"></header>

<header class="page-hero br-hero">
  <div class="wrap">
    <div class="br-hero-copy">
      <div class="ph-kicker mono">TOURNAMENT · 赛事进程</div>
      <h1>赛事<span>进程</span></h1>
      <p class="br-hero-deck">从擂台赛到总决赛，查看每个赛段推进到哪一步、各赛段对阵与<span class="br-nowrap">比分</span>、<span class="br-nowrap">赛事积分榜</span>。<b>不推断</b>官方尚未公布的对阵关系。</p>
      <div class="br-kpis" aria-label="赛事概览">
        <div class="br-kpi"><b id="kStages">—</b><span>赛段</span></div>
        <div class="br-kpi"><b id="kTeams">—</b><span>战队</span></div>
        <div class="br-kpi"><b id="kDone">—</b><span>已完赛</span></div>
        <div class="br-kpi"><b id="kTotal">—</b><span>总场次</span></div>
      </div>
    </div>
    <div class="br-event-wrap">
      <div class="br-event" id="brEvent">
        <div class="br-event-top">
          <span class="br-event-label"><i></i>当前赛事</span>
          <div class="br-event-pick">
            <button id="brPrev" type="button" aria-label="更近一届赛事">‹</button>
            <select id="brSel" aria-label="切换赛事"></select>
            <button id="brNext" type="button" aria-label="更早一届赛事">›</button>
          </div>
        </div>
        <h2 id="brName">—</h2>
        <div class="br-event-meta" id="brMeta"></div>
        <div class="br-event-focus" id="brFocus"></div>
        <div class="br-event-foot">
          <a class="br-cta" href="#brBracketSec" id="brToBracket">查看赛事进程</a>
          <a class="br-event-link" href="bracket-forecast.html">冠军预测 →</a>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap br-main">
  <section class="br-stagestrip" aria-label="赛段推进">
    <div class="br-strip-head">
      <div><span class="br-eyebrow">STAGES</span><h2>赛段推进</h2></div>
      <span class="br-strip-note" id="brRailNote">—</span>
      <div class="br-railbtns">
        <button id="brRailPrev" type="button" aria-label="向前浏览赛段">‹</button>
        <button id="brRailNext" type="button" aria-label="向后浏览赛段">›</button>
      </div>
    </div>
    <div class="br-rail" id="brRail"></div>
  </section>

  <section class="br-sec" id="brBracketSec">
    <div class="br-sechead">
      <div><span class="br-eyebrow">MATCHES</span><h2>赛事进程</h2></div>
      <span class="br-secnote">选择赛段查看全部比赛 · 可点进复盘或交手</span>
    </div>
    <div class="br-stageview" id="brStageView">
      <div class="br-stageview-head">
        <div class="br-stageview-title">
          <span class="br-col-kicker" id="brStageKicker">STAGE 01</span>
          <h3 id="brStageName">—</h3>
          <span class="br-colmeta" id="brStageMeta">—</span>
        </div>
        <div class="br-stageview-actions">
          <button id="brStagePrev" type="button" aria-label="上一个赛段">‹</button>
          <button id="brStageNext" type="button" aria-label="下一个赛段">›</button>
        </div>
        <span class="br-colbar"><i id="brStageBar" style="width:0%"></i></span>
      </div>
      <div class="br-matchgrid" id="brMatchGrid"></div>
      <div class="br-stageview-foot"><button class="br-stage-more" id="brStageMore" type="button" hidden>显示更多</button></div>
    </div>
    <div class="br-note" id="brNote"></div>
  </section>

  <section class="br-sec" id="brStandingsSec">
    <div class="br-sechead">
      <div><span class="br-eyebrow">STANDINGS</span><h2 id="stTitle">赛事积分榜</h2></div>
      <span class="br-secnote">只统计已结束比赛 · 自算排序</span>
    </div>
    <div class="br-standings" id="brStandings"></div>
  </section>

  <section class="br-sec">
    <div class="br-sechead">
      <div><span class="br-eyebrow">NOTES</span><h2>赛制与口径</h2></div>
      <a class="br-event-link" href="about.html">数据说明 →</a>
    </div>
    <div class="br-rules" id="brRules"></div>
  </section>
</main>

<button class="br-backtop" id="brBackTop" type="button" aria-label="回到顶部">↑</button>
<footer id="siteFooter" class="footer"></footer>
