<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛程中心 · KPL 数据中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230A111C'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='none' stroke='%23F6C021' stroke-width='2'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='16' font-weight='bold' fill='%23F6C021' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=49">
<link rel="stylesheet" href="assets/pages.css?v=49">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KPL 数据中心">
<meta property="og:title" content="赛程中心 · KPL 数据中心">
<meta property="og:description" content="KPL 赛事数据产品：赛程比分、战队/选手/英雄数据、BP 分析、逐局复盘与实时胜率预测。2019–2026 全历史。">
<meta property="og:image" content="https://kpldata-site.hccccc01333.workers.dev/assets/shots/02-live.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="schedule.html">
<header id="siteHeader"></header>

<header class="page-hero">
  <div class="wrap">
    <div class="ph-kicker mono">SCHEDULE · 赛程中心</div>
    <h1>赛程与回放</h1>
    <p>2019–2026 全部 {N} 场比赛：比分、赛段、回放视频与数据复盘入口。可切换年份 / 赛事，
      或按赛段、战队、状态筛选。</p>
    <div class="ph-meta mono">
      <span>大场 <b id="mTotal">—</b></span><i>/</i>
      <span>已结束 <b id="mDone">—</b></span><i>/</i>
      <span>有视频 <b id="mVid">—</b></span><i>/</i>
      <span>可复盘 <b id="mDetail">—</b></span><i>/</i>
      <span>实时同步 <b id="liveAt">—</b></span>
    </div>
  </div>
</header>

<main class="wrap" style="margin-top:26px">
  <!-- 赛事中心闭环：今日 / 直播 → 赛果 → 详情，不用先筛表格 -->
  <section class="block" id="todayBlock" style="margin-top:0">
    <div class="block-head">
      <h2><i></i>今日 &amp; 直播</h2>
      <span class="block-note mono" id="todayNote">—</span>
    </div>
    <div class="fh" style="padding:16px 18px"><div class="fh-today" id="todayCards"></div></div>
  </section>

  <section class="block" id="recentBlock">
    <div class="block-head">
      <h2><i></i>最近赛果</h2>
      <span class="block-note mono">点「复盘」进逐局时间轴 · 徽标表示该场能看到什么数据</span>
    </div>
    <div class="panel table-panel"><table class="tbl">
      <thead><tr><th class="num">日期</th><th>对阵</th><th class="num">比分</th><th>数据完整度</th><th class="num">进入</th></tr></thead>
      <tbody id="recentRows"></tbody>
    </table></div>
  </section>

  <div class="scopebar" id="scopeBar"></div>
  <div class="filterbar">
    <label class="fld"><span>赛段</span>
      <select id="fStage"><option value="">全部赛段</option></select>
    </label>
    <label class="fld"><span>状态</span>
      <select id="fStatus">
        <option value="">全部状态</option>
        <option>已结束</option>
        <option>未开始</option>
      </select>
    </label>
    <label class="fld grow"><span>搜索战队</span>
      <input class="search" id="fTeam" placeholder="输入战队名，如 重庆狼队">
    </label>
    <span class="block-note mono" id="countNote"></span>
  </div>
  <div class="brief" id="brief"></div>
  <div id="list"></div>
  <div style="text-align:center;margin:18px 0 8px">
    <button class="btn ghost" id="moreBtn" style="display:none">显示更多（已显示 <span id="shownN">0</span> / <span id="totalN">0</span>）</button>
  </div>
</main>

<footer id="siteFooter" class="footer"></footer>

<script src="assets/data.js?v=49"></script>
<script src="assets/seasons.js?v=49"></script>
<script src="assets/schedule_all.js?v=49"></script>
<script src="assets/coverage.js?v=49"></script>
<script src="assets/common.js?v=49"></script>
<script>
(function () {
  "use strict";
  var D = KPL.data, K = KPL, $ = function (s) { return document.querySelector(s); };
  K.init();

  var ALL = window.KPL_SCHEDULE_ALL || [];
  var PAGE = 90, shown = PAGE;
  document.querySelector(".page-hero p").innerHTML =
    document.querySelector(".page-hero p").innerHTML.replace("{N}", K.fmtInt(ALL.length));
  $("#mTotal").textContent = K.fmtInt(ALL.length);
  $("#mDone").textContent = K.fmtInt(ALL.filter(function (r) { return r.done; }).length);
  $("#mVid").textContent = K.fmtInt(ALL.filter(function (r) { return r.video; }).length);
  $("#mDetail").textContent = K.fmtInt(ALL.filter(function (r) { return r.hasDetail; }).length);

  var curScope = "all";

  function inScope(r) {
    if (curScope === "all") return true;
    if (/^\d{4}$/.test(curScope)) return String(r.year) === curScope;
    return r.leagueId === curScope;
  }

  function filtered() {
    var st = $("#fStatus").value, stage = $("#fStage").value, q = $("#fTeam").value.trim();
    return ALL.filter(function (r) {
      if (!inScope(r)) return false;
      if (st && (r.done ? "已结束" : "未开始") !== st) return false;
      if (stage && r.stage !== stage) return false;
      if (q && r.team1.indexOf(q) < 0 && r.team2.indexOf(q) < 0) return false;
      return true;
    }).reverse();
  }

  function fillStages() {
    var cur = $("#fStage").value;
    var stages = {};
    ALL.forEach(function (r) { if (inScope(r) && r.stage) stages[r.stage] = 1; });
    var keys = Object.keys(stages).slice(0, 40);
    $("#fStage").innerHTML = '<option value="">全部赛段</option>' +
      keys.map(function (s2) { return "<option" + (s2 === cur ? " selected" : "") + ">" + K.esc(s2) + "</option>"; }).join("");
  }

  function rowHTML(r) {
    var live = r.st === 1 || (!r.done && K.isLive(r));
    var score;
    if (live && (r.score1 > 0 || r.score2 > 0)) {
      score = '<div class="score">' +
        '<span class="' + (r.score1 > r.score2 ? "w" : "") + '">' + r.score1 + "</span> : " +
        '<span class="' + (r.score2 > r.score1 ? "w" : "") + '">' + r.score2 + "</span></div>";
    } else if (!r.done) {
      score = '<div class="score" style="color:#8A94A6;font-size:12.5px">VS</div>';
    } else {
      score = '<div class="score">' +
        '<span class="' + (r.score1 > r.score2 ? "w" : "") + '">' + r.score1 + "</span> : " +
        '<span class="' + (r.score2 > r.score1 ? "w" : "") + '">' + r.score2 + "</span></div>";
    }
    var chip = live ? K.liveBadge()
      : (r.done ? '<span class="chip done">已结束</span>' : '<span class="chip next">未开始</span>');
    var hasData = r.hasDetail || r.st === 1;
    var covHTML = K.coverageMask(r.matchId) ? K.coverageBadges(K.coverageMask(r.matchId)) : "";
    var acts = '<div class="acts">' +
      (r.video ? '<a class="go" href="' + K.esc(r.video) + '" target="_blank" rel="noopener">回放↗</a>' : "") +
      (hasData ? '<a class="go" href="match.html?id=' + K.esc(r.matchId) + '">' + (live ? "实时 →" : (r.hasDetail ? "复盘 →" : "详情 →")) + "</a>" : "") +
      (!r.video && !hasData ? '<span class="go off">—</span>' : "") +
      "</div>";
    // 整行可点：手机端不依赖右侧小按钮也能进详情
    return '<div class="mrow" data-mid="' + K.esc(r.matchId) + '"' +
      (hasData ? ' data-href="match.html?id=' + K.esc(r.matchId) + '" style="cursor:pointer"' : "") + ">" +
      '<div class="mt">' + K.esc(r.time || "—") + "</div>" +
      K.side(r.team1, r.icon1, false) + score + K.side(r.team2, r.icon2, true) +
      "<div>" + chip + covHTML + "</div>" + acts + "</div>";
  }

  function render() {
    var rows = filtered();
    if (shown > rows.length) shown = Math.max(PAGE, rows.length);
    var view = rows.slice(0, shown);
    $("#countNote").textContent = "共 " + rows.length + " 场（" + K.scopeName(curScope) + "）";
    if (!rows.length) {
      $("#list").innerHTML = '<div class="empty-tip">没有符合条件的场次</div>';
      $("#moreBtn").style.display = "none";
      return;
    }
    var html = "", lastDate = "";
    view.forEach(function (r) {
      if (r.date !== lastDate) {
        if (lastDate) html += "</div>";
        html += '<div class="day-block"><div class="dh"><b>' + K.esc(K.dateCN(r.date)) + "</b><span>" +
          K.esc(K.weekdayCN(r.date)) + (r.stage ? " · " + K.esc(r.stage) : "") +
          " · " + K.esc(r.leagueName) + "</span></div>";
        lastDate = r.date;
      }
      html += rowHTML(r);
    });
    html += "</div>";
    $("#list").innerHTML = html;
    /* 数据简报 */
    var fin = rows.filter(function (r) { return r.done; });
    var today = new Date().toISOString().slice(0, 10);
    var todayRows = rows.filter(function (r) { return r.date === today; });
    var liveRow = rows.filter(function (r) { return r.st === 1; })[0];
    var txt = "当前范围共 <b>" + rows.length + "</b> 场（已结束 " + fin.length + " 场）。";
    if (liveRow) {
      txt += "正在进行：<b>" + K.esc(liveRow.team1) + " " + liveRow.score1 + " : " + liveRow.score2 + " " + K.esc(liveRow.team2) + "</b>。";
    } else if (todayRows.length) {
      txt += "今天有 <b>" + todayRows.length + "</b> 场比赛。";
    }
    var up = rows.filter(function (r) { return !r.done; }).sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); })[0];
    if (up) {
      txt += "下一场：<b>" + K.esc(up.date.slice(5)) + " " + K.esc(up.time) + " " + K.esc(up.team1) + " vs " + K.esc(up.team2) + "</b>。";
    }
    txt += "点「回放」看官方录像，「复盘」进数据详情。";
    K.brief("#brief", txt);

    $("#shownN").textContent = shown;
    $("#totalN").textContent = rows.length;
    $("#moreBtn").style.display = shown < rows.length ? "" : "none";
  }


  /* 整行可点（移动端友好）：点行内链接时让链接自己走 */
  document.getElementById("list").addEventListener("click", function (e) {
    if (e.target.closest("a")) return;
    var row = e.target.closest(".mrow[data-href]");
    if (row) location.href = row.getAttribute("data-href");
  });

  /* ---------- 实时比分覆盖（live.today，防重建滞后） ---------- */
  function loadLiveScript(cb) {
    var sc = document.createElement("script");
    sc.src = "assets/live.js?ts=" + Date.now();
    sc.onload = function () { cb(window.KPL_LIVE); sc.remove(); };
    sc.onerror = function () { cb(null); sc.remove(); };
    document.head.appendChild(sc);
  }
  function liveRowOf(L, matchId) {
    if (!L) return null;
    return (L.today || []).filter(function (x) { return x.matchId === matchId; })[0] ||
           (L.matches || []).filter(function (x) { return x.matchId === matchId; })[0] || null;
  }

  /* 实时比分覆盖（每 60 秒） */
  function applyToday() {
    loadLiveScript(function (L) {
      if (!L || !L.today) return;
      var at = document.getElementById("liveAt");
      if (at) at.textContent = String(L.updatedAt || "").slice(11, 19);
      L.today.forEach(function (t) {
        var row = document.querySelector('.mrow[data-mid="' + t.matchId + '"]');
        if (!row) return;
        var scEl = row.querySelector(".score");
        if (scEl && (t.score1 > 0 || t.score2 > 0 || t.st === 2)) {
          scEl.innerHTML = '<span class="' + (t.score1 > t.score2 ? "w" : "") + '">' + t.score1 + "</span> : " +
            '<span class="' + (t.score2 > t.score1 ? "w" : "") + '">' + t.score2 + "</span>";
        }
        var chipWrap = row.children[4];
        if (chipWrap) {
          if (t.st === 1) {
            chipWrap.innerHTML = K.liveBadge();
            var actsL = row.querySelector(".acts");
            if (actsL && !actsL.querySelector('a[href^="match.html"]')) {
              actsL.innerHTML = '<a class="go" href="match.html?id=' + encodeURIComponent(t.matchId) + '">实时 →</a>';
            }
          }
          else if (t.st === 2) {
            chipWrap.innerHTML = '<span class="chip done">已结束</span>';
            var link = row.querySelector('.acts a[href^="match.html"]');
            if (link) link.textContent = "复盘 →";
          } else {
            chipWrap.innerHTML = '<span class="chip next">未开始</span>';
          }
        }
      });
    });
  }
  setInterval(applyToday, 30000);

  /* ---------- 今日 & 直播 / 最近赛果（闭环第一屏） ---------- */
  function renderTodayFocus() {
    var ALL = window.KPL_SCHEDULE_ALL || [];
    var todayIso = new Date().toISOString().slice(0, 10);
    var today = ALL.filter(function (r) { return r.date === todayIso; })
      .sort(function (a, b) { return String(a.time).localeCompare(String(b.time)); });
    var live = ALL.filter(function (r) { return r.st === 1; });
    var note = document.getElementById("todayNote");
    var box = document.getElementById("todayCards");
    if (!box) return;
    if (note) {
      note.textContent = today.length
        ? todayIso.slice(5) + " · " + today.length + " 场" + (live.length ? " · 直播中 " + live.length + " 场" : "")
        : "今日无赛程 · 看一下最近结果";
    }
    var rows = today.length ? today : ALL.filter(function (r) { return r.done; })
      .sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); }).slice(0, 3);
    box.innerHTML = rows.map(function (r) {
      var done = r.st === 2, isLive = r.st === 1;
      return '<a class="fh-tcard" href="match.html?id=' + encodeURIComponent(r.matchId) + '">' +
        '<span class="t mono">' + K.esc(today.length ? r.time : String(r.date).slice(5)) + "</span>" +
        '<span class="tm">' + K.esc(r.team1) + " vs " + K.esc(r.team2) + "</span>" +
        '<span class="sc mono">' + (done || isLive ? r.score1 + ":" + r.score2 : "—") + "</span>" +
        '<span class="st">' + (isLive ? '<span class="dot-live"></span> 直播中' : done ? "已结束" : "待开赛") + "</span></a>";
    }).join("") || '<div class="empty-tip">暂无赛程</div>';
  }

  function renderRecentRows() {
    var ALL = window.KPL_SCHEDULE_ALL || [];
    var tbody = document.getElementById("recentRows");
    if (!tbody) return;
    var rows = ALL.filter(function (r) { return r.done; })
      .sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); }).slice(0, 6);
    tbody.innerHTML = rows.map(function (r) {
      var w = r.score1 > r.score2 ? r.team1 : r.team2;
      return "<tr><td class='num mono'>" + K.esc(String(r.date).slice(5)) + "</td>" +
        "<td><a class='team-cell' href='match.html?id=" + encodeURIComponent(r.matchId) + "' style='color:inherit'>" +
        K.esc(r.team1) + " vs " + K.esc(r.team2) + "</a><div class='block-note mono'>" +
        K.esc(w) + " 胜 · " + K.esc(r.leagueName || "") + "</div></td>" +
        "<td class='num mono'>" + r.score1 + " : " + r.score2 + "</td>" +
        "<td>" + K.coverageBadges(K.coverageMask(r.matchId)) + "</td>" +
        "<td class='num'><a class='go' href='match.html?id=" + encodeURIComponent(r.matchId) +
        "' style='color:var(--gold);font-weight:700'>" +
        (K.coverageMask(r.matchId) & 8 ? "复盘 →" : "详情 →") + "</a></td></tr>";
    }).join("") || "<tr><td colspan='5' style='color:var(--muted)'>暂无已结束比赛</td></tr>";
  }

  curScope = K.scopeBar("#scopeBar", function (id) { curScope = id; shown = PAGE; fillStages(); render(); });
  ["fStatus", "fStage"].forEach(function (id) {
    $("#" + id).addEventListener("change", function () { shown = PAGE; render(); });
  });
  $("#fTeam").addEventListener("input", function () { shown = PAGE; render(); });
  $("#moreBtn").addEventListener("click", function () { shown += PAGE; render(); });
  fillStages();
  render();
  applyToday();
  renderTodayFocus();
  renderRecentRows();
})();
</script>
</body>
</html>
