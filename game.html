<script>
(function () {
  "use strict";
  var D = KPL.data, K = KPL, $ = function (s) { return document.querySelector(s); };
  K.init();
  var CP = K.chartPalette();
  var BID = new URLSearchParams(location.search).get("id") || "";

  function fail(msg, back) {
    $("#wrapHero").innerHTML = '<header class="page-hero"><div class="wrap">' +
      '<div class="ph-kicker mono">GAME · 对局详情</div><h1>' + K.esc(msg) + "</h1>" +
      '<p>对局详情覆盖 2019–2026 全部已完赛对局；请从比赛页或选手页进入。</p>' +
      '<div class="slide-cta" style="margin-top:18px"><a class="btn primary" href="' + (back || "schedule.html") +
      '">' + (back ? "返回比赛" : "返回赛程") + "</a></div></div></header>";
  }

  if (!BID) { fail("缺少对局参数"); return; }
  /* battle_id 前缀与官方 match_id 不同：全文索引查找 */
  var MID = "", LG = "";
  Object.keys(window.KPL_GAME_INDEX || {}).some(function (mid) {
    var e = KPL_GAME_INDEX[mid];
    for (var i = 0; i < e.b.length; i++) {
      if (e.b[i][0] === BID) { MID = mid; LG = e.lg; return true; }
    }
    return false;
  });
  if (!MID) { fail("未找到该对局"); return; }
  var sched = (window.KPL_SCHEDULE_ALL || []).filter(function (r) { return r.matchId === MID; })[0] || {};

  var heroIcon = {};
  ((K.scopeOf("all") || {}).heroes || []).forEach(function (h) { heroIcon[h.name] = h.icon; });

  fetch("assets/games/" + LG + ".json").then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }).then(function (data) {
    var g = data[BID];
    if (!g) { fail("未找到该对局", "match.html?id=" + MID); return; }
    render(g);
  }).catch(function () {
    fail("对局数据加载失败（请通过本地服务器打开站点）");
  });

  function render(g) {
    var isLiveG = g.live === 1 || g.win === 0 || g.win == null;
    var winName = g.win === 1 ? g.t1 : (g.win === 2 ? g.t2 : "");
    $("#wrapHero").innerHTML = '<header class="page-hero"><div class="wrap">' +
      '<div class="ph-kicker mono">GAME · ' + K.esc(sched.leagueName || "") +
      (sched.stage ? " · " + K.esc(sched.stage) : "") + " · " + K.esc(sched.date || "") + " · 第 " + g.seq + " 局</div>" +
      '<div class="g-score">' +
      '<div class="g-team ' + (g.win === 1 ? "win" : "") + '">' + (g.i1 ? '<img src="' + K.esc(g.i1) + '" alt="">' : "") +
      "<span>" + K.esc(g.t1) + "</span><b class='mono'>" + g.k1 + "</b><i>击杀</i></div>" +
      '<div class="g-mid"><span class="mono">' + g.dur + " 分钟</span><b class='mono'>" +
      K.signed(g.g1 - g.g2) + "</b><span class='mono' style='color:var(--muted)'>金币差（蓝方视角）</span>" +
      (isLiveG ? "<em>" + K.liveBadge() + " 已进行 " + g.dur + " 分钟</em>"
               : "<em>胜方：" + K.esc(winName) + "</em>") + "</div>" +
      '<div class="g-team r ' + (g.win === 2 ? "win" : "") + '">' + (g.i2 ? '<img src="' + K.esc(g.i2) + '" alt="">' : "") +
      "<span>" + K.esc(g.t2) + "</span><b class='mono'>" + g.k2 + "</b><i>击杀</i></div></div>" +
      '<div style="margin-top:14px">' + K.coverageBadges(K.battleCoverageMask(MID, BID)) +
      '<div class="cov-note">本局可看的内容：亮色=有数据，虚线=官方未提供</div></div>' +
      '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<a class="btn ghost sm" href="match.html?id=' + K.esc(MID) + '">← 整场详情</a>' +
      '<a class="btn ghost sm" href="bp-studio.html?match=' + encodeURIComponent(MID) + '&amp;g=' + encodeURIComponent(g.seq) + '">赛事 BP 演播室 →</a>' +
      (g.video ? '<a class="btn primary sm" href="' + K.esc(g.video) + '" target="_blank" rel="noopener">看本局回放 ↗</a>'
               : '<a class="btn ghost sm" href="https://search.bilibili.com/all?keyword=' +
                 encodeURIComponent("KPL " + g.t1 + " " + g.t2 + " 第" + g.seq + "局") +
                 '" target="_blank" rel="noopener">去 B 站找本局 ↗</a>') +
      "</div></div></header>";

    /* BP */
    var picks1 = g.bp.filter(function (b) { return b[0] === 1 && b[1] === 1; });
    var picks2 = g.bp.filter(function (b) { return b[0] === 2 && b[1] === 1; });
    var bans1 = g.bp.filter(function (b) { return b[0] === 1 && b[1] === 0; });
    var bans2 = g.bp.filter(function (b) { return b[0] === 2 && b[1] === 0; });
    function pickChips(list) {
      return list.map(function (p, i) {
        var ic = heroIcon[p[2]];
        return '<span class="bp-pick"><em>' + (i + 1) + '</em>' +
          (ic ? '<img src="' + K.esc(ic) + '" alt="">' : "") + K.esc(p[2]) + "</span>";
      }).join("");
    }
    function banChips(list) {
      return list.map(function (p) {
        var ic = heroIcon[p[2]];
        return (ic ? '<img src="' + K.esc(ic) + '" alt="" title="禁用 ' + K.esc(p[2]) + '">' : "");
      }).join("");
    }

    /* 选手行 */
    function sideRows(camp, team, win) {
      return g.players.filter(function (p) { return p.c === camp; }).map(function (p) {
        var ic = heroIcon[p.h];
        var equips = (p.eq || []).map(function (n) {
          var ei = (window.KPL_EQUIP_ICONS || {})[n] || "";
          return '<span class="g-eq" title="' + K.esc(n) + '">' + (ei ? '<img src="' + K.esc(ei) + '" alt="" loading="lazy">' : "") + "</span>";
        }).join("");
        var ava = p.pi ? '<img class="g-ava" src="' + K.esc(p.pi) + '" alt="" loading="lazy">'
          : '<span class="g-ava ph">' + K.esc(String(p.n).slice(0, 1)) + "</span>";
        return '<div class="g-prow' + (p.mvp ? " mvp" : "") + '">' +
          '<a class="g-hero" href="hero.html?id=' + encodeURIComponent(p.h) + '">' +
          (ic ? '<img src="' + K.esc(ic) + '" alt="">' : "") + "<span>" + K.esc(p.h) + "</span></a>" +
          '<a class="g-player" href="player.html?id=' + encodeURIComponent(p.n) + '">' + ava +
          "<span>" + K.esc(p.n) + (p.mvp ? '<em class="mvp-tag">MVP</em>' : "") + "</span></a>" +
          '<div class="g-kda mono">' + p.k + "/" + p.d + "/" + p.a + "</div>" +
          '<div class="g-stat"><span class="mono">' + K.fmtInt(p.g) + "</span><small>经济</small></div>" +
          '<div class="g-stat"><span class="mono">' + K.mpct(p.dmg, 1) + '</span><small>输出</small></div>' +
          '<div class="g-stat"><span class="mono">' + K.mpct(p.bh, 1) + '</span><small>承受</small></div>' +
          '<div class="g-kit">' + equips +
          (p.sai ? '<span class="g-eq sa" title="' + K.esc(p.sa) + '"><img src="' + K.esc(p.sai) + '" alt=""></span>' : "") +
          "</div></div>";
      }).join("");
    }

    var hasReplay = window.KPL_REPLAY && KPL_REPLAY.hasReplay(MID);
    $("#main").innerHTML =
      '<div class="block-head"><h2><i></i>复盘工作台</h2><span class="block-note mono">' +
      (hasReplay ? "先看一句话结论与三个转折 · 需要时再展开逐分钟时间轴"
                 : "本局没有分钟级快照 · 只有基础比分 / BP / 选手明细") + "</span></div>" +
      '<div class="panel" style="padding:14px"><div id="replayWorkbench">' +
      (hasReplay ? "" : '<div class="empty-tip">本局暂无分钟级复盘数据。' +
        (window.KPL_TOTALS ? "全站 " + KPL_TOTALS.replayBattles + " / " + K.fmtInt(KPL_TOTALS.battles) +
          " 局有直播胜率；其余只展示赛果、BP 与选手明细。" : "仅有赛果、BP 与选手明细。") + "</div>") + "</div></div>" +
      '<div class="bp-grid" style="margin-top:18px">' +
      '<div class="bp-side blue"><div class="hd">' + K.esc(g.t1) + "（蓝方）</div>" +
      '<div class="bp-picks">' + pickChips(picks1) + "</div>" +
      '<div class="bp-bans">ban：' + banChips(bans1) + "</div></div>" +
      '<div class="bp-side red"><div class="hd">' + K.esc(g.t2) + "（红方）</div>" +
      '<div class="bp-picks">' + pickChips(picks2) + "</div>" +
      '<div class="bp-bans">ban：' + banChips(bans2) + "</div></div></div>" +

      '<div class="g-teams">' +
      '<div class="panel g-side"><div class="panel-title">' + K.esc(g.t1) + " 阵容" +
      (g.win === 1 ? ' <em class="mono" style="color:var(--gold)">胜</em>' : "") + "</div>" + sideRows(1, g.t1, g.win === 1) + "</div>" +
      '<div class="panel g-side"><div class="panel-title">' + K.esc(g.t2) + " 阵容" +
      (g.win === 2 ? ' <em class="mono" style="color:var(--gold)">胜</em>' : "") + "</div>" + sideRows(2, g.t2, g.win === 2) + "</div>" +
      "</div>" +
      '<div class="panel-foot mono" style="margin-top:12px">数据来源：官方逐局数据 · ' +
      K.esc(MID) + " 第 " + g.seq + " 局" + (g.video ? "" : "（本局无回放视频）") + "</div>";
    if (hasReplay) {
      KPL_REPLAY.mount(document.getElementById("replayWorkbench"), { matchId: MID, battleId: BID });
    }

    /* 数据曲线（比赛期间采集的指标序列，如已归档） */
    (function () {
      var sc = document.createElement("script");
      sc.src = "assets/live.js?ts=" + Date.now();
      sc.onload = function () {
        sc.remove();
        var L = window.KPL_LIVE || {};
        var all = (L.history || []).concat(L.matches || []);
        var h = all.filter(function (x) { return x.battleId === BID; })[0];
        if (!h || !(h.pts || []).length || h.pts.length < 3) return;
        renderCurves(h);
      };
      sc.onerror = function () { sc.remove(); };
      document.head.appendChild(sc);
    })();
    K.refresh();
  }

  function renderCurves(h) {
    var pts = h.pts;
    var LANES = ["对抗路", "打野", "中路", "发育路", "游走"];
    var laneNames = null, curTab = "win", curveEvents = [];
    /* 队伍主色：深色台面用 金 / 蓝（与分路卡、复盘台一致），日光主题换高对比红 / 蓝 */
    var LIGHT = document.documentElement.classList.contains("light-site");
    var TC = LIGHT ? { t1: "#C43A4B", t2: "#2E6FD0" } : { t1: "#F6C021", t2: "#6EAFFF" };
    var CN1 = LIGHT ? "红" : "金";
    var TEAM_TABS = [
      ["win", "胜负天平"], ["gd", "经济差动力"], ["eco", "经济总量"],
      ["kill", "击杀"], ["tower", "推塔"], ["res", "中立资源"]
    ];
    var LANE_TABS = [["lane", "分路对位"]];
    var last = pts[pts.length - 1];
    var box = document.createElement("div");
    box.className = "panel";
    box.style.marginTop = "14px";
    box.innerHTML =
      '<div class="panel-title">数据曲线 <em class="mono">逐分钟采集 · 模型实时推算</em></div>' +
      '<div class="curve-score" id="curveScore"></div>' +
      '<div class="curve-groups">' +
        '<div class="curve-group"><span class="curve-label mono">团队</span>' +
          '<div class="seg curve-tabs" id="curveTabsTeam">' +
          TEAM_TABS.map(function (t, i) { return '<button type="button" data-t="' + t[0] + '" class="' + (i === 0 ? "on" : "") + '">' + t[1] + "</button>"; }).join("") +
          "</div></div>" +
        '<div class="curve-group"><span class="curve-label mono">分路</span>' +
          '<div class="seg curve-tabs" id="curveTabsLane">' +
          LANE_TABS.map(function (t) { return '<button type="button" data-t="' + t[0] + '">' + t[1] + "</button>"; }).join("") +
          "</div></div>" +
      "</div>" +
      '<div class="curve-summary" id="curveSummary"></div>' +
      '<div class="live-chart" id="curveChart"></div>' +
      '<div class="panel-foot mono" id="curveNote"></div>';
    var main = document.getElementById("main");
    if (main) main.prepend(box);

    /* 终局记分牌：先给结论，曲线负责讲过程 */
    (function renderScore() {
      var el = document.getElementById("curveScore");
      if (!el) return;
      var chip = function (v, lb) { return '<span class="cs-k"><b class="mono">' + v + "</b><em>" + lb + "</em></span>"; };
      el.innerHTML =
        '<div class="cs-team"><span class="cs-dot" style="background:' + TC.t1 + '"></span><b>' + K.esc(h.t1) + "</b>" +
        chip((Number(last[2]) / 1000).toFixed(1) + "k", "经济") + chip(last[4], "击杀") +
        chip(last[6], "推塔") + chip(last[8], "主宰") + chip(last[10], "暴君") + "</div>" +
        '<span class="cs-final mono">终局</span>' +
        '<div class="cs-team"><span class="cs-dot" style="background:' + TC.t2 + '"></span><b>' + K.esc(h.t2) + "</b>" +
        chip((Number(last[3]) / 1000).toFixed(1) + "k", "经济") + chip(last[5], "击杀") +
        chip(last[7], "推塔") + chip(last[9], "主宰") + chip(last[11], "暴君") + "</div>";
    })();

    if (window.KPL_REPLAY && KPL_REPLAY.loadPackage) {
      KPL_REPLAY.loadPackage(MID, function (pkg) {
        var bt = null;
        if (pkg && pkg.battles) {
          for (var i = 0; i < pkg.battles.length; i++) {
            if (pkg.battles[i].battleId === BID) { bt = pkg.battles[i]; break; }
          }
        }
        if (bt && bt.names && bt.names.length === 10) laneNames = bt.names;
        if (bt && bt.events) curveEvents = bt.events || [];
        if (["lane", "win", "eco", "gd", "kill", "tower", "res"].indexOf(curTab) >= 0) draw(curTab);
      });
    }

    function kFmt(v) {
      var n = Number(v || 0);
      return (n > 0 ? "+" : n < 0 ? "-" : "") + Math.abs(Math.round(n / 1000)) + "k";
    }
    function absFmt(v) {
      return Math.round(Math.abs(Number(v || 0)) / 1000) + "k";
    }
    function kOut(v) {
      var a = Math.abs(Number(v) || 0);
      return a >= 950 ? (Math.round(a / 100) / 10).toFixed(1) + "k" : Math.round(Number(v) || 0) + "";
    }
    function updateSummary(m) {
      var box2 = document.getElementById("curveSummary");
      if (!box2) return;
      var best = pts.reduce(function (a, r) {
        return Math.abs(Number(r[0]) - m) < Math.abs(Number(a[0]) - m) ? r : a;
      }, pts[0]);
      var evs = (curveEvents || []).filter(function (e) { return Math.abs(Number(e.m) - Number(best[0])) <= 0.75; }).slice(0, 2);
      box2.innerHTML =
        '<div><span>分钟</span><b>' + Number(best[0]).toFixed(0) + "′</b></div>" +
        '<div><span>模型胜率</span><b>' + Math.round(Number(best[1]) * 100) + "%</b></div>" +
        '<div><span>金差</span><b class="' + (best[2] - best[3] >= 0 ? "up" : "down") + '">' + kFmt(best[2] - best[3]) + "</b></div>" +
        '<div><span>击杀</span><b>' + best[4] + ":" + best[5] + "</b></div>" +
        '<div><span>事件</span><b>' + (evs.length ? evs.map(function (e) { return K.esc(e.label); }).join(" · ") : "—") + "</b></div>";
    }

    function teamSeries(idx) {
      return [
        { name: h.t1, color: TC.t1, pts: pts.map(function (r) { return [r[0], r[idx]]; }) },
        { name: h.t2, color: TC.t2, pts: pts.map(function (r) { return [r[0], r[idx + 1]]; }) }
      ];
    }

    function draw(id) {
      var el2 = document.getElementById("curveChart");
      var note = document.getElementById("curveNote");
      curTab = id;
      var common = {
        height: 540, yTicks: 5, events: curveEvents,
        onHover: function (d) { updateSummary(d.m); },
        xEvery: Math.max(1, Math.ceil((pts[pts.length - 1][0] - pts[0][0]) / 8))
      };
      if (id === "win") {
        /* 胜负天平：以 50% 为轴的优势面积图——0 线上方面积 = t1 优势，下方 = t2 优势 */
        var probs = pts.map(function (r) { return Number(r[1]); });
        var devs = probs.map(function (p) { return p - 0.5; });
        /* 纵轴按两侧实际优势幅度收紧：单边碾压局不再留半屏空白 */
        var upDev = Math.max(0.12, Math.max.apply(null, devs)) * 1.18;
        var dnDev = Math.min(-0.04, Math.min.apply(null, devs)) * 1.18;
        var bands = [];
        (function () {
          var seg = null;
          for (var i = 0; i < devs.length; i++) {
            var dv = devs[i];
            var side = dv >= 0.15 ? 1 : dv <= -0.15 ? 2 : 0;
            if (seg && side === seg.side) seg.to = Number(pts[i][0]);
            else {
              if (seg && seg.side && seg.to - seg.from >= 2) bands.push(seg);
              seg = side ? { side: side, from: Number(pts[i][0]), to: Number(pts[i][0]) } : null;
            }
          }
          if (seg && seg.side && seg.to - seg.from >= 2) bands.push(seg);
        })();
        K.lineChart(el2, Object.assign({}, common, {
          legend: false,
          bands: bands.map(function (b2) {
            return { from: b2.from, to: b2.to + 0.5, color: b2.side === 1 ? TC.t1 : TC.t2, opacity: 0.09 };
          }),
          yDomain: [dnDev, upDev],
          yFmt: function (v) { var n = Math.round(v * 100); return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n) + "%"; },
          refLines: [{ v: 0, label: "五五开", color: "#8FA0B8", opacity: 0.7 }],
          series: [
            { name: h.t1 + " 优势面积", color: TC.t1, fill: true, fillSolid: true, fillOpacity: 0.42, fillTo: 0,
              nostroke: true, noTip: true,
              pts: pts.map(function (r, i) { return [r[0], Math.max(0, devs[i])]; }) },
            { name: h.t2 + " 优势面积", color: TC.t2, fill: true, fillSolid: true, fillOpacity: 0.42, fillTo: 0,
              nostroke: true, noTip: true,
              pts: pts.map(function (r, i) { return [r[0], Math.min(0, devs[i])]; }) },
            { name: "胜率摆动", color: LIGHT ? "#93A2B8" : "#D6DEEA", width: 2.2, glow: true,
              pts: pts.map(function (r, i) { return [r[0], devs[i]]; }) }
          ]
        }));
        note.textContent = K.esc(h.t1) + " 视角天平图：0 线（五五开）之上的面积 = " + K.esc(h.t1) + " 优势，之下 = " +
          K.esc(h.t2) + " 优势，面积厚薄即优势幅度；色带 = 连续 2 分钟以上的强势期，竖线为关键事件。";
      } else if (id === "gd") {
        /* 动力柱：每分钟一根，上下分色 = 当前领先方 */
        var diffs = pts.map(function (r) { return Number(r[2]) - Number(r[3]); });
        var posMax = Math.max(1000, Math.max.apply(null, diffs)) * 1.12;
        var negMax = Math.max(1000, -Math.min.apply(null, diffs)) * 1.12;
        var ser = [{ name: "经济差", bars: true, color: TC.t1, barColors: { pos: TC.t1, neg: TC.t2 }, opacity: 0.9,
                     pts: pts.map(function (r) { return [r[0], Number(r[2]) - Number(r[3])]; }) }];
        if ((h.gpred || []).length >= 3) {
          ser.push({ name: "5 分钟前外推", color: CP.label, dash: true, width: 1.8, pts: h.gpred });
        }
        K.lineChart(el2, Object.assign({}, common, {
          legend: false,
          yDomain: [-negMax, posMax], yFmt: kFmt,
          refLines: [{ v: 0, label: "均势", color: "#8FA0B8", opacity: 0.55 }],
          series: ser
        }));
        note.textContent = "每分钟一根动力柱：" + CN1 + "柱 = " + K.esc(h.t1) + " 领先、蓝柱 = " + K.esc(h.t2) +
          " 领先，柱高即差距；虚线是用 5 分钟前走势外推的对照。";
      } else if (id === "eco") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max.apply(null, pts.map(function (r) { return Math.max(Number(r[2]), Number(r[3])); })) * 1.08],
          yFmt: absFmt,
          series: teamSeries(2)
        }));
        note.textContent = "两队总经济随比赛发展；差值结构看「经济差动力」更直观。";
      } else if (id === "kill") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max.apply(null, pts.map(function (r) { return Math.max(Number(r[4]), Number(r[5])); })) * 1.12],
          yFmt: Math.round,
          series: teamSeries(4).map(function (se) { se.step = true; se.markGrowth = true; return se; })
        }));
        note.textContent = "阶梯 = 累计击杀，圆点 = 该分钟发生击杀；爆发期（连续圆点）通常对应团战。";
      } else if (id === "tower") {
        K.lineChart(el2, Object.assign({}, common, {
          yDomain: [0, Math.max.apply(null, pts.map(function (r) { return Math.max(Number(r[6]), Number(r[7])); })) * 1.12],
          yFmt: Math.round,
          series: teamSeries(6).map(function (se) { se.step = true; se.markGrowth = true; return se; })
        }));
        note.textContent = "阶梯 = 累计推塔，圆点 = 该分钟有塔被破；推进节奏通常比单点击杀更能解释胜率摆动。";
      } else if (id === "res") {
        resourceTimeline(el2, note);
      } else {
        renderLaneDuel(el2, note);
      }
      updateSummary(pts[pts.length - 1][0]);
    }

    /* 中立资源：击杀时刻点状时间轴。累计折线表达不了「什么时候断龙」，点 + 终局计数更直接 */
    function resourceTimeline(el2, note) {
      var ROWS = [{ nm: "主宰", base: 8 }, { nm: "黑暗暴君", base: 10 }];
      var W = 1040, PL = 92, PR = 76, top = 26, laneH = 150, H = top + ROWS.length * laneH + 44;
      var maxM = Math.max(10, Math.ceil(Number(last[0])));
      var X = function (m) { return PL + Number(m) / maxM * (W - PL - PR); };
      var evs = [];
      ROWS.forEach(function (rc, ri) {
        for (var i = 1; i < pts.length; i++) {
          if (Number(pts[i][rc.base]) > Number(pts[i - 1][rc.base])) evs.push({ ri: ri, t: 1, m: Number(pts[i][0]) });
          if (Number(pts[i][rc.base + 1]) > Number(pts[i - 1][rc.base + 1])) evs.push({ ri: ri, t: 2, m: Number(pts[i][0]) });
        }
      });
      var step = maxM <= 25 ? 5 : maxM <= 50 ? 10 : 15;
      var s = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="中立资源击杀时间轴">';
      ROWS.forEach(function (rc, ri) {
        var cy = top + ri * laneH + laneH / 2;
        s += '<rect x="' + PL + '" y="' + (cy - 32) + '" width="' + (W - PL - PR) + '" height="64" rx="10" fill=' +
          JSON.stringify(CP.grid) + ' opacity=".38"/>';
        s += '<text x="' + (PL - 14) + '" y="' + (cy + 5) + '" text-anchor="end" font-size="13.5" font-weight="800" fill=' +
          JSON.stringify(CP.label) + ' font-family="Inter,monospace">' + rc.nm + "</text>";
        s += '<text x="' + (W - PR + 10) + '" y="' + (cy - 7) + '" text-anchor="end" font-size="14" font-weight="800" fill="' + TC.t1 +
          '" font-family="Inter,monospace">' + Math.round(Number(last[rc.base])) + "</text>";
        s += '<text x="' + (W - PR + 10) + '" y="' + (cy + 16) + '" text-anchor="end" font-size="14" font-weight="800" fill="' + TC.t2 +
          '" font-family="Inter,monospace">' + Math.round(Number(last[rc.base + 1])) + "</text>";
      });
      for (var m = 0; m <= maxM; m += step) {
        s += '<line x1="' + X(m).toFixed(1) + '" y1="' + top + '" x2="' + X(m).toFixed(1) + '" y2="' + (H - 32) +
          '" stroke=' + JSON.stringify(CP.grid) + ' stroke-dasharray="3 5" opacity=".8"/>';
        s += '<text x="' + X(m).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10.5" fill=' +
          JSON.stringify(CP.label) + ' font-family="Inter,monospace">' + m + "′</text>";
      }
      evs.forEach(function (e) {
        var cy = top + e.ri * laneH + laneH / 2 + (e.t === 1 ? -12 : 12);
        var col = e.t === 1 ? TC.t1 : TC.t2;
        var team = e.t === 1 ? h.t1 : h.t2;
        var tot = Math.round(Number(last[e.t === 1 ? ROWS[e.ri].base : ROWS[e.ri].base + 1]));
        s += '<g class="res-dot"><circle cx="' + X(e.m).toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="7.5" fill="' + col +
          '" stroke=' + JSON.stringify(CP.dot) + ' stroke-width="2.2"/>' +
          "<title>" + K.esc(Math.round(e.m) + "′ " + team + " 击杀" + ROWS[e.ri].nm + "（队伍累计第 " + tot + " 条）") + "</title></g>";
      });
      s += "</svg>";
      el2.innerHTML = '<div class="res-tl">' + s + "</div>";
      note.textContent = "每个圆点是一次击杀时刻（" + CN1 + " = " + K.esc(h.t1) + "，蓝 = " + K.esc(h.t2) +
        "），悬停看详情；右侧为终局累计。主宰 / 黑暗暴君断档的时段一眼可见。";
    }

    function lanePairs() {
      if (!laneNames || laneNames.length !== 10) return null;
      var pairs = [];
      var idxOf = function (nm) {
        for (var k = 0; k < (h.names || []).length; k++) if (h.names[k] === nm) return k;
        return -1;
      };
      for (var i = 0; i < 5; i++) {
        var a = idxOf(laneNames[i]), b = idxOf(laneNames[i + 5]);
        if (a < 0 || b < 0) return null;
        pairs.push({ lane: LANES[i], a: a, b: b, n1: laneNames[i], n2: laneNames[i + 5] });
      }
      return pairs;
    }

    function laneEndDiff(pk, isGold) {
      var r = last;
      return isGold ? Number(r[12 + pk.a * 2] || 0) - Number(r[12 + pk.b * 2] || 0)
                    : Number(r[12 + pk.a * 2 + 1] || 0) - Number(r[12 + pk.b * 2 + 1] || 0);
    }

    /* 分路对位探索器：点一条路进一张大决斗图——拔河条 + 领先差面积 + 反超洞察，滑杆逐分钟看 */
    function renderLaneDuel(el2, note) {
      var pairs = lanePairs();
      if (!pairs) {
        /* 无复盘名单：一张大图 10 条曲线（同队用透明度区分分路） */
        var OPS = [1, 0.82, 0.64, 0.48, 0.34];
        var valAt = function (i3, r) { return (r[12 + i3 * 2] || 0); };
        var ser = [];
        for (var i2 = 0; i2 < 10; i2++) {
          (function (i3) {
            var t1side = !h.pcamp || h.pcamp[i3] === 1;
            ser.push({
              name: (h.names && h.names[i3]) || ("P" + (i3 + 1)),
              color: t1side ? TC.t1 : TC.t2,
              opacity: OPS[i3 % 5],
              width: 2,
              pts: pts.map(function (r) { return [r[0], valAt(i3, r)]; })
            });
          })(i2);
        }
        K.lineChart(el2, {
          height: 540, yFmt: absFmt, yMin0: true, xEvery: Math.max(1, Math.ceil((last[0] - pts[0][0]) / 8)),
          events: curveEvents, onHover: function (d) { updateSummary(d.m); }, series: ser
        });
        note.textContent = "10 名选手的个人经济（" + CN1 + "系 = " + K.esc(h.t1) +
          "，蓝系 = " + K.esc(h.t2) + "），同队内越透明越靠游走位；本局无分钟级复盘名单，暂不能做同位置对位。";
        return;
      }
      var sel = 0, bestD = -1;
      pairs.forEach(function (pk, i) {
        var d = Math.abs(laneEndDiff(pk, true));
        if (d > bestD) { bestD = d; sel = i; }
      });
      var metric = "gold", curSeq = null, curPk = pairs[sel];
      el2.innerHTML =
        '<div class="duel-topbar"><div class="duel-chips" id="duelChips"></div>' +
          '<div class="seg duel-metric" id="duelMetric">' +
          '<button type="button" data-m="gold" class="on">经济</button>' +
          '<button type="button" data-m="dmg">输出</button></div></div>' +
        '<div class="duel-head" id="duelHead"></div>' +
        '<div class="duel-tug" id="duelTug"></div>' +
        '<div class="duel-slider"><span class="mono" id="duelMin"></span>' +
        '<input type="range" id="duelRange" min="0" max="100" step="0.2" value="100" aria-label="对位时间轴"></div>' +
        '<div id="duelLead"></div>' +
        '<div class="duel-insights" id="duelIns"></div>';
      var chipsEl = document.getElementById("duelChips");
      var headEl = document.getElementById("duelHead");
      var tugEl = document.getElementById("duelTug");
      var minEl = document.getElementById("duelMin");
      var rangeEl = document.getElementById("duelRange");
      var leadEl = document.getElementById("duelLead");
      var insEl = document.getElementById("duelIns");
      var seqOf = function (pk, isGold) {
        return pts.map(function (r) {
          var a = isGold ? Number(r[12 + pk.a * 2] || 0) : Number(r[12 + pk.a * 2 + 1] || 0);
          var b = isGold ? Number(r[12 + pk.b * 2] || 0) : Number(r[12 + pk.b * 2 + 1] || 0);
          return [r[0], a, b, a - b];
        });
      };
      function setMinute(m) {
        var best = curSeq.reduce(function (a, q) {
          return Math.abs(Number(q[0]) - m) < Math.abs(Number(a[0]) - m) ? q : a;
        }, curSeq[0]);
        var sum = best[1] + best[2];
        var share = sum > 0 ? best[1] / sum : 0.5;
        tugEl.innerHTML = '<i style="width:' + (share * 100).toFixed(1) + '%;background:' + TC.t1 + '"></i>' +
          '<i style="flex:1;background:' + TC.t2 + '"></i>';
        minEl.textContent = Math.round(Number(best[0])) + "′";
        rangeEl.value = String(best[0]);
      }
      function renderDuel() {
        curPk = pairs[sel];
        var isGold = metric === "gold";
        curSeq = seqOf(curPk, isGold);
        var endQ = curSeq[curSeq.length - 1];
        var endD = endQ[3];
        chipsEl.innerHTML = pairs.map(function (p2, i) {
          var s2 = seqOf(p2, isGold);
          var d2 = s2[s2.length - 1][3];
          return '<button type="button" class="duel-chip' + (i === sel ? " on" : "") + '" data-i="' + i + '" title="' +
            K.esc(p2.n1 + " vs " + p2.n2) + '"><b>' + p2.lane + '</b><span class="dc-diff" style="color:' +
            (d2 >= 0 ? TC.t1 : TC.t2) + '">' + (d2 >= 0 ? "+" : "−") + kOut(d2) + "</span></button>";
        }).join("");
        headEl.innerHTML =
          '<div class="duel-p"><b style="color:' + TC.t1 + '">' + K.esc(curPk.n1) +
          '</b><span class="dp-v mono" style="color:' + TC.t1 + '">' + kOut(endQ[1]) + "</span></div>" +
          '<span class="duel-vs mono">VS</span>' +
          '<div class="duel-p r"><span class="dp-v mono" style="color:' + TC.t2 + '">' + kOut(endQ[2]) +
          '</span><b style="color:' + TC.t2 + '">' + K.esc(curPk.n2) + "</b></div>";
        rangeEl.max = String(last[0]);
        var diffs = curSeq.map(function (q) { return q[3]; });
        var upAbs = Math.max(300, Math.max.apply(null, diffs)) * 1.15;
        var dnAbs = Math.min(-300, Math.min.apply(null, diffs)) * 1.15;
        K.lineChart(leadEl, {
          height: 400, yTicks: 4, legend: false,
          xEvery: Math.max(1, Math.ceil((last[0] - pts[0][0]) / 8)),
          events: curveEvents,
          onHover: function (d) { setMinute(d.m); updateSummary(d.m); },
          yDomain: [dnAbs, upAbs], yFmt: kFmt,
          refLines: [{ v: 0, label: "均势", color: "#8FA0B8", opacity: 0.7 }],
          series: [
            { name: curPk.n1 + " 领先面积", color: TC.t1, fill: true, fillSolid: true, fillOpacity: 0.44, fillTo: 0,
              nostroke: true, noTip: true,
              pts: curSeq.map(function (q) { return [q[0], Math.max(0, q[3])]; }) },
            { name: curPk.n2 + " 领先面积", color: TC.t2, fill: true, fillSolid: true, fillOpacity: 0.44, fillTo: 0,
              nostroke: true, noTip: true,
              pts: curSeq.map(function (q) { return [q[0], Math.min(0, q[3])]; }) },
            { name: "领先差", color: LIGHT ? "#93A2B8" : "#D6DEEA", width: 2, glow: true,
              pts: curSeq.map(function (q) { return [q[0], q[3]]; }) }
          ]
        });
        var flips = 0, posMin = 0, negMin = 0, maxLead = { d: diffs[0], m: curSeq[0][0] };
        for (var i = 1; i < diffs.length; i++) {
          if ((diffs[i - 1] > 0 && diffs[i] < 0) || (diffs[i - 1] < 0 && diffs[i] > 0)) flips++;
          if (diffs[i] > 0) posMin++;
          else if (diffs[i] < 0) negMin++;
          if (Math.abs(diffs[i]) > Math.abs(maxLead.d)) maxLead = { d: diffs[i], m: curSeq[i][0] };
        }
        var tot = Math.max(1, posMin + negMin);
        insEl.innerHTML =
          '<div><span>领先易手</span><b>' + flips + " 次</b></div>" +
          '<div><span>最大领先</span><b style="color:' + (maxLead.d >= 0 ? TC.t1 : TC.t2) + '">' +
          (maxLead.d >= 0 ? "+" : "−") + kOut(Math.abs(maxLead.d)) + " @ " + Math.round(Number(maxLead.m)) + "′</b></div>" +
          '<div><span>领先时长</span><b><i style="color:' + TC.t1 + ';font-style:normal">' + Math.round(posMin / tot * 100) +
          '%</i> · <i style="color:' + TC.t2 + ';font-style:normal">' + Math.round(negMin / tot * 100) + '%</i></b></div>' +
          '<div><span>终局差</span><b style="color:' + (endD >= 0 ? TC.t1 : TC.t2) + '">' +
          (endD >= 0 ? "+" : "−") + kOut(Math.abs(endD)) + "</b></div>";
        setMinute(Number(last[0]));
      }
      chipsEl.addEventListener("click", function (e) {
        var c = e.target.closest(".duel-chip");
        if (!c) return;
        sel = Number(c.getAttribute("data-i"));
        renderDuel();
      });
      document.getElementById("duelMetric").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        metric = b.getAttribute("data-m");
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
        renderDuel();
      });
      rangeEl.addEventListener("input", function () { setMinute(Number(rangeEl.value)); });
      renderDuel();
      note.textContent = "点上方切换分路（对抗路→游走）与口径；拖动滑杆或悬停曲线逐分钟看这一路的拔河与领先差——" +
        "色块厚薄即领先幅度，0 线上下翻转即领先易手。";
    }

    function bindTabs() {
      ["#curveTabsTeam", "#curveTabsLane"].forEach(function (sel) {
        var tabs = document.querySelector(sel);
        if (!tabs) return;
        tabs.addEventListener("click", function (e) {
          var b = e.target.closest("button"); if (!b) return;
          Array.prototype.forEach.call(tabs.children, function (x) { x.classList.toggle("on", x === b); });
          var other = sel === "#curveTabsTeam" ? "#curveTabsLane" : "#curveTabsTeam";
          var otherTabs = document.querySelector(other);
          if (otherTabs) Array.prototype.forEach.call(otherTabs.children, function (x) { x.classList.remove("on"); });
          draw(b.getAttribute("data-t"));
        });
      });
    }
    bindTabs();
    draw("win");

}
})();
</script>
</body>
</html>
